; Draco Insomnis Server — settings for every PHP site on this server.
; Change them with "sudo draco set <key> <value>" or here; they apply to the next request.
; A [site:example.com] section at the end overrides them for one site (and its subdomains).

; Firewall (SQL injection, file inclusion, scanners…): off, log (write it down) or block (403).
waf_mode = "log"

; Anti-copy pace limit for pages a person reads: off, log or block (429 until the minute ends).
pace_mode = "off"
anticopy_rate_ip = "120"
anticopy_rate_net = "600"

; Visitor address behind a proxy: "" (connection address, recommended), "cf" (Cloudflare) or "xff".
proxy_header = ""
trusted_proxies = ""

; Extra rented-server networks (CIDR), added to the ones Draco knows.
hosting_nets = ""

; Country filter (off by default): off, block (refuse the countries listed) or allow (only those),
; for "sensitive" pages (login, sign-up, anything posted) or the whole "site"; "log" first.
; The list (DB-IP Lite, CC BY 4.0) is downloaded when you switch it on and refreshed monthly.
geo_mode = "off"
geo_countries = ""
geo_scope = "sensitive"
geo_action = "log"

; Security headers on answers (nosniff, SAMEORIGIN, Referrer-Policy, Permissions-Policy), never one
; the application already sends; HSTS only when the whole site works on HTTPS.
headers = "0"
hsts = "0"

; Addresses never blocked or limited (yours, your office), comma-separated.
admin_ips = ""

; Who gets the e-mail when a visitor asks to review a block (at most one an hour). Empty: nobody.
notify = ""
; Language of that e-mail and of the evidence: en or es. Visitors get theirs from the browser.
lang = "en"

; CrowdSec (https://crowdsec.net), both ways. In: the bans of its Local API become Draco blocks
; (they may read, not post), copied at most once a minute; get the key with "cscli bouncers add draco".
; Out: crowdsec_log = "1" writes Draco's attempts to events.log in each PHP user's folder, for the
; parser and scenario in /usr/share/draco-insomnis/crowdsec (draco crowdsec tells where to put them).
crowdsec_lapi_url = ""
crowdsec_api_key = ""
crowdsec_log = "0"

; Path prefixes never inspected (health checks, webhooks…), comma-separated.
except = ""

; Path endings of login and sign-up pages: a blocked address may read the site but not post nor use these.
sensitive = "/wp-login.php, /login, /register, /signup, /user/login, /user/register, /login/index.php, /login/signup.php, /administrator/index.php, /Special:UserLogin, /Special:CreateAccount, /typo3/, /admin, /customer/account/login, /customer/account/create"

; Example:
; [site:shop.example.com]
; waf_mode = "block"
; pace_mode = "log"

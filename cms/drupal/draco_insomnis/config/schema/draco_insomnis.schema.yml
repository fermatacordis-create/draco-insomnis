draco_insomnis.settings:
  type: config_object
  label: 'Draco Insomnis settings'
  mapping:
    shield:
      type: boolean
      label: 'Protect user sign-ups'
    waf_mode:
      type: string
      label: 'Firewall mode: off, log or block'
    pace_mode:
      type: string
      label: 'Anti-copy pace limit mode: off, log or block'
    anticopy_rate_ip:
      type: integer
      label: 'Pages per minute, per address'
    anticopy_rate_net:
      type: integer
      label: 'Pages per minute, per network'
    proxy_header:
      type: string
      label: 'Visitor address: empty, cf or xff'
    trusted_proxies:
      type: string
      label: 'Trusted proxies, one address or CIDR per line'
    hosting_nets:
      type: string
      label: 'Rented-server networks, one CIDR per line'
    geo_mode:
      type: string
      label: 'Country filter: off, block or allow'
    geo_countries:
      type: string
      label: 'Countries (two-letter codes)'
    geo_scope:
      type: string
      label: 'Where: sensitive or site'
    geo_action:
      type: string
      label: 'What to do: log or block'
    geo_file:
      type: string
      label: 'Country list file (empty = public files folder)'
    headers:
      type: boolean
      label: 'Security headers on public pages'
    hsts:
      type: boolean
      label: 'HSTS over HTTPS'
    pwd_min:
      type: integer
      label: 'Minimum password length (0 = none)'
    pwd_breached:
      type: boolean
      label: 'Refuse passwords found in data breaches'

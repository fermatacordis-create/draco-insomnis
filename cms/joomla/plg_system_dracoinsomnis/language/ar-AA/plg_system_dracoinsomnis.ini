PLG_SYSTEM_DRACOINSOMNIS="النظام - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. يوقف التسجيلات المزيفة بلا كابتشا، مع جدار حماية للتطبيق وحدّ لسرعة التصفح ضد النسخ. مفتوح المصدر."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="يوقف التسجيلات المزيفة بلا كابتشا: لا تحصل الروبوتات على حساب، وتُحفظ كل محاولة مشبوهة 90 يومًا دليلًا لبلاغ عن إساءة الاستخدام. لا يُرسل أي شيء إلى المهاجم أبدًا."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="عنوانك كما تراه الإضافة: %1$s (عنوان الاتصال: %2$s). إذا كان الموقع خلف Cloudflare أو وكيل آخر واختلف هذان عن عنوانك الحقيقي، فاختر الخيار المناسب في «عنوان الزائر»."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="حماية تسجيلات المستخدمين"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="يضيف فخًا غير مرئي وختمًا موقّعًا للصفحة إلى نموذج التسجيل. لا تحصل الروبوتات على حساب؛ وثلاث محاولات روبوت في يوم واحد تحظر العنوان أسبوعًا."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="جدار الحماية"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="يوقف الطلبات التي تحمل شكل هجوم (حقن قاعدة البيانات، قراءة ملفات الخادم، تشغيل شيفرة، سكربتات في الروابط) والماسحات مثل sqlmap أو Nikto. ابدأ بـ«التسجيل فقط» وانتقل إلى «حظر» بعد بضعة أيام. خمس هجمات في 10 دقائق تحظر العنوان أسبوعًا؛ ويظل بإمكان العناوين المحظورة قراءة الموقع، لكن دون الإرسال. لا يُفحص المستخدمون القادرون على دخول لوحة الإدارة أبدًا. مخرج الطوارئ: define('DRACO_WAF_OFF', true); في ملف defines.php في جذر الموقع."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="حدّ سرعة التصفح ضد النسخ"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="من يطلب صفحات في الدقيقة أكثر مما يقرأ الإنسان يتلقى «429 Too many requests» حتى تنتهي الدقيقة. لا يُقيَّد أبدًا المستخدمون المسجلون دخولهم ولا عناوينك ولا محركات البحث الموثّقة عبر DNS (Google وBing وApple وYandex)."

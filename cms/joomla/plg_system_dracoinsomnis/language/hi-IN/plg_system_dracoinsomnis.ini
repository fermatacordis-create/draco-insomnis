PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="प्लगइन को दिखने वाला आपका पता: %1$s (कनेक्शन का पता: %2$s)। अगर साइट Cloudflare या किसी दूसरे प्रॉक्सी के पीछे है और ये आपके असली पते से अलग हैं, तो “आगंतुक का पता” में सही विकल्प चुनें।"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="उपयोगकर्ता पंजीकरण सुरक्षित करें"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="पंजीकरण फ़ॉर्म में एक अदृश्य जाल और पेज की हस्ताक्षरित मुहर जोड़ता है। बॉट को खाता नहीं मिलता; एक दिन में तीन बॉट प्रयास उस पते को एक हफ़्ते के लिए ब्लॉक कर देते हैं।"
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="फ़ायरवॉल"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="हमले जैसे दिखने वाले अनुरोध (डेटाबेस इंजेक्शन, सर्वर की फ़ाइलें पढ़ना, कोड चलाना, लिंक में स्क्रिप्ट) और sqlmap या Nikto जैसे स्कैनर रोकता है। “केवल दर्ज करें” से शुरू करें और कुछ दिनों बाद “ब्लॉक करें” पर जाएँ। 10 मिनट में पाँच हमले उस पते को एक हफ़्ते के लिए ब्लॉक कर देते हैं; ब्लॉक किए गए पते साइट पढ़ सकते हैं, पर कुछ भेज नहीं सकते। जो उपयोगकर्ता एडमिन में लॉग इन कर सकते हैं, उनकी कभी जाँच नहीं होती। आपातकालीन रास्ता: साइट की रूट में defines.php में define('DRACO_WAF_OFF', true); लिखें।"

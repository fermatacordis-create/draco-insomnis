PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Header keamanan"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Di halaman publik: tanpa menebak jenis berkas, tanpa disematkan di situs lain, lebih sedikit data perujuk, tanpa kamera, mikrofon, atau lokasi untuk konten sematan. Tidak pernah header yang sudah dikirim."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Paksa HTTPS selama 6 bulan (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Hanya jika seluruh situs berjalan di HTTPS dan akan tetap begitu: peramban mengingatnya dan menolak HTTP sampai kedaluwarsa."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Panjang minimum kata sandi"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="8 sampai 64 karakter; 0 hanya menyisakan aturan Pengguna: Opsi. Berlaku saat membuat akun atau mengganti kata sandi."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Tolak kata sandi yang ditemukan dalam kebocoran data"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Menanyakan Have I Been Pwned dengan k-anonimitas: hanya 5 karakter SHA-1 kata sandi yang keluar dari situs, tidak pernah kata sandinya. Jika layanan tidak menjawab dalam 3 detik, kata sandi diterima."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="Kata sandi harus minimal %d karakter."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Kata sandi ini muncul di kebocoran data yang diketahui, jadi penyerang mencobanya lebih dulu. Silakan pilih yang lain."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Blokir alamat atau rentang"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Diterapkan saat Anda menyimpan, lalu kolom ini dikosongkan. Tidak pernah administrator, juga bukan alamat Anda sendiri. Rentang tidak lebih lebar dari /16 (IPv4) atau /32 (IPv6)."

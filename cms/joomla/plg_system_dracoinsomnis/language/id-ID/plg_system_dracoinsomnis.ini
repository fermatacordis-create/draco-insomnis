PLG_SYSTEM_DRACOINSOMNIS="Sistem - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Menghentikan pendaftaran palsu tanpa captcha, firewall aplikasi, dan batas laju anti-salin. Sumber terbuka."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Menghentikan pendaftaran palsu tanpa captcha: bot tidak mendapat akun, dan setiap percobaan mencurigakan disimpan 90 hari sebagai bukti untuk laporan penyalahgunaan. Tidak ada yang pernah dikirim balik ke penyerang."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Alamat Anda menurut plugin: %1$s (alamat koneksi: %2$s). Jika situs berada di belakang Cloudflare atau proxy lain dan keduanya berbeda dari alamat asli Anda, pilih opsi yang sesuai di “Alamat pengunjung”."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Lindungi pendaftaran pengguna"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Menambahkan perangkap tak terlihat dan cap halaman bertanda tangan ke formulir pendaftaran. Bot tidak mendapat akun; tiga percobaan bot dalam sehari memblokir alamat selama seminggu."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Firewall"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Menghentikan permintaan berbentuk serangan (injeksi basis data, membaca berkas server, menjalankan kode, skrip dalam tautan) dan pemindai seperti sqlmap atau Nikto. Mulailah dengan “Catat saja” lalu pindah ke “Blokir” setelah beberapa hari. Lima serangan dalam 10 menit memblokir alamat selama seminggu; alamat yang diblokir tetap bisa membaca situs, tetapi tidak bisa mengirim. Pengguna yang bisa masuk ke administrator tidak pernah diperiksa. Jalan darurat: define('DRACO_WAF_OFF', true); di defines.php pada akar situs."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Batas laju anti-salin"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Yang meminta lebih banyak halaman per menit daripada yang dibaca manusia mendapat “429 Too many requests” sampai menit itu berakhir. Pengguna yang masuk, alamat Anda sendiri, dan mesin pencari yang diverifikasi lewat DNS (Google, Bing, Apple, Yandex) tidak pernah dibatasi."

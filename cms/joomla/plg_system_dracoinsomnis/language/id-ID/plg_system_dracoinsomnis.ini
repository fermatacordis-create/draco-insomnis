PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Hanya koneksi dari alamat ini yang boleh menetapkan alamat pengunjung lewat header. Satu alamat atau rentang per baris. Kosong: server ini dan jaringan privat. Rentang milik Cloudflare sudah dikenal."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="Header diabaikan: koneksi ini (%s) tidak berasal dari Cloudflare maupun proxy tepercaya. Jika proxy Anda ada di internet, tambahkan alamatnya di “Proxy tepercaya”."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Negara"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Pengunjung Anda bisa datang dari banyak negara, dan penyerang berganti negara dengan VPN. Saring hanya login, pendaftaran, dan formulir, dan mulailah dengan “Catat saja”. Administrator, orang yang Anda izinkan lewat, dan mesin pencari tidak pernah disaring. Firewall harus aktif (catat atau blokir)."

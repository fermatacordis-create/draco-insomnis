PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="The country list could not be downloaded. The filter does nothing until it is there; save again later."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Security headers"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="On public pages: no sniffing of file types, no framing by other sites, less referrer data, no camera, microphone or location for embedded content. Never one already sent."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Force HTTPS for 6 months (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Only when the whole site works on HTTPS and will keep working: browsers remember it and refuse plain HTTP until it expires."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Minimum password length"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="From 8 to 64 characters; 0 leaves only the rules of Users: Options. Applied when an account is created or a password is changed."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Refuse passwords found in data breaches"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Asks Have I Been Pwned with k-anonymity: only 5 characters of the password’s SHA-1 leave the site, never the password. If the service does not answer in 3 seconds, the password is accepted."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="The password must have at least %d characters."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="This password appears in known data breaches, so attackers try it first. Please choose another one."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Block an address or range"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Applied when you save, then these fields are emptied. Never an administrator, nor your own address. Ranges no wider than /16 (IPv4) or /32 (IPv6)."

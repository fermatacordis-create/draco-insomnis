PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Security headers"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="On public pages: no sniffing of file types, no framing by other sites, less referrer data, no camera, microphone or location for embedded content. Never one already sent."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Force HTTPS for 6 months (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Only when the whole site works on HTTPS and will keep working: browsers remember it and refuse plain HTTP until it expires."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Block an address or range"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Applied when you save, then these fields are emptied. Never an administrator, nor your own address. Ranges no wider than /16 (IPv4) or /32 (IPv6)."

PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Countries"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Most of your visitors may come from many countries, and an attacker changes country with a VPN. Filter only logging in, signing up and forms, and start with 'Log only'. Administrators, people you let through and search engines are never filtered. Needs the firewall on (log or block)."

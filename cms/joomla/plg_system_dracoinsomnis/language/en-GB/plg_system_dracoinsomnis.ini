PLG_SYSTEM_DRACOINSOMNIS="System - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Stops fake sign-ups without captchas, application firewall and anti-copy pace limit. Open source."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Stops fake sign-ups without captchas: bots get no account, and every suspicious attempt is kept for 90 days as evidence for an abuse report. Nothing is ever sent back to the attacker."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Your address as the plugin sees it: %1$s (connection address: %2$s). If the site is behind Cloudflare or another proxy and these differ from your real address, choose the matching option in 'Visitor address'."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Protect user sign-ups"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Adds an invisible trap and a signed page stamp to the sign-up form. Bots get no account; three bot attempts in a day block the address for a week."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Firewall"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Stops requests with the shape of an attack (database injection, reading server files, running code, scripts in links) and scanners such as sqlmap or Nikto. Start with 'Log only' and move to 'Block' after a few days. Five attacks in 10 minutes block the address for a week; blocked addresses can still read the site, but not post. Users who can log in to the administrator are never inspected. Emergency exit: define('DRACO_WAF_OFF', true); in defines.php at the site root."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Anti-copy pace limit"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="More pages per minute than a person reads get '429 Too many requests' until the minute ends. Logged-in users, your own addresses and search engines verified by DNS (Google, Bing, Apple, Yandex) are never limited."
PLG_SYSTEM_DRACOINSOMNIS_MODE_OFF="Off"
PLG_SYSTEM_DRACOINSOMNIS_MODE_LOG="Log only: record what it would stop"
PLG_SYSTEM_DRACOINSOMNIS_MODE_BLOCK="Block"
PLG_SYSTEM_DRACOINSOMNIS_RATE_IP_LABEL="Pages per minute, per address"
PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_LABEL="Pages per minute, per network"
PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="A /24 network for IPv4 or a /64 for IPv6: what a scraper gets when it rotates addresses next to each other."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_LABEL="Visitor address"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_DESC="Leave 'Connection address' unless the site is behind a proxy: a header can be forged by anyone."

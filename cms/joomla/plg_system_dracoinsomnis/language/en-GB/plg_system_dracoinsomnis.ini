PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Only connections from these addresses may set the visitor address through a header. One address or range per line. Empty: this server and private networks. Cloudflare's own ranges are already known."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="The header is ignored: this connection (%s) does not come from Cloudflare or from a trusted proxy. If your proxy is on the internet, add its addresses in 'Trusted proxies'."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Countries"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Most of your visitors may come from many countries, and an attacker changes country with a VPN. Filter only logging in, signing up and forms, and start with 'Log only'. Administrators, people you let through and search engines are never filtered. Needs the firewall on (log or block)."

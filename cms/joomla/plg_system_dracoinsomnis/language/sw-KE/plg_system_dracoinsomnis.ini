PLG_SYSTEM_DRACOINSOMNIS="Mfumo - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Huzuia usajili bandia bila captcha, ngome ya mtandao ya programu na kikomo cha kasi dhidi ya kunakili. Chanzo huria."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Huzuia usajili bandia bila captcha: roboti hazipati akaunti, na kila jaribio la kutiliwa shaka huhifadhiwa siku 90 kama ushahidi wa ripoti ya matumizi mabaya. Hakuna kinachorudishwa kwa mshambuliaji."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Anwani yako kama programu-jalizi inavyoiona: %1$s (anwani ya muunganisho: %2$s). Ikiwa tovuti iko nyuma ya Cloudflare au proksi nyingine na hizi zinatofautiana na anwani yako halisi, chagua chaguo linalofaa katika “Anwani ya mgeni”."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Linda usajili wa watumiaji"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Huongeza mtego usioonekana na muhuri wa ukurasa uliotiwa saini kwenye fomu ya usajili. Roboti hazipati akaunti; majaribio matatu ya roboti kwa siku moja huzuia anwani kwa wiki moja."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Ngome ya mtandao"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Huzuia maombi yenye umbo la shambulio (kudunga hifadhidata, kusoma faili za seva, kuendesha msimbo, hati katika viungo) na vichanganuzi kama sqlmap au Nikto. Anza na “Rekodi tu” kisha badilisha kuwa “Zuia” baada ya siku chache. Mashambulio matano ndani ya dakika 10 huzuia anwani kwa wiki moja; anwani zilizozuiwa bado zinaweza kusoma tovuti, lakini haziwezi kutuma. Watumiaji wanaoweza kuingia kwenye usimamizi hawakaguliwi kamwe. Njia ya dharura: define('DRACO_WAF_OFF', true); katika defines.php kwenye mzizi wa tovuti."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Kikomo cha kasi dhidi ya kunakili"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Anayeomba kurasa nyingi kwa dakika kuliko anavyosoma mtu hupata “429 Too many requests” hadi dakika iishe. Watumiaji walioingia, anwani zako mwenyewe na injini za utafutaji zilizothibitishwa kwa DNS (Google, Bing, Apple, Yandex) hawawekewi kikomo kamwe."

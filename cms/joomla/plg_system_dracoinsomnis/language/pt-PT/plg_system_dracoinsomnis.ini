PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="Geolocalização de IP pela DB-IP (db-ip.com, CC BY 4.0), descarregada quando liga o filtro e consultada no seu próprio servidor: nenhum endereço é enviado para lado nenhum."
PLG_SYSTEM_DRACOINSOMNIS_GEO_DOWNLOADED="Lista de países transferida."
PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="Não foi possível descarregar a lista de países. O filtro não faz nada até ela lá estar; guarde novamente mais tarde."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Cabeçalhos de segurança"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Nas páginas públicas: sem adivinhar tipos de ficheiro, sem apresentação dentro de outros sites, menos dados de origem, sem câmara, microfone ou localização para conteúdo incorporado. Nunca um já enviado."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Forçar HTTPS durante 6 meses (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Só se todo o site funcionar em HTTPS e continuar assim: os navegadores lembram-se e recusam HTTP até expirar."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Comprimento mínimo da palavra-passe"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="De 8 a 64 caracteres; 0 deixa só as regras de Utilizadores: Opções. Aplica-se ao criar uma conta ou mudar uma palavra-passe."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Recusar palavras-passe encontradas em fugas de dados"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Pergunta ao Have I Been Pwned com k-anonimato: só saem do site 5 caracteres do SHA-1 da palavra-passe, nunca a palavra-passe. Se o serviço não responder em 3 segundos, a palavra-passe é aceite."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="A palavra-passe deve ter pelo menos %d caracteres."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Esta palavra-passe aparece em fugas de dados conhecidas, por isso os atacantes experimentam-na primeiro. Escolha outra, por favor."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Bloquear um endereço ou intervalo"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Aplica-se ao guardar; depois estes campos ficam vazios. Nunca um administrador, nem o seu próprio endereço. Intervalos não mais largos do que /16 (IPv4) ou /32 (IPv6)."

PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Proxies de confiança"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Só as ligações vindas destes endereços podem definir o endereço do visitante através de um cabeçalho. Um endereço ou intervalo por linha. Vazio: este servidor e as redes privadas. Os intervalos do próprio Cloudflare já são conhecidos."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="O cabeçalho é ignorado: esta ligação (%s) não vem do Cloudflare nem de um proxy de confiança. Se o seu proxy estiver na internet, acrescente os endereços dele em «Proxies de confiança»."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Países"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Os seus visitantes podem vir de muitos países, e um atacante muda de país com uma VPN. Filtre apenas o início de sessão, o registo e os formulários, e comece com «Apenas registar». Administradores, pessoas que deixou passar e motores de pesquisa nunca são filtrados. Precisa da firewall ligada (registar ou bloquear)."

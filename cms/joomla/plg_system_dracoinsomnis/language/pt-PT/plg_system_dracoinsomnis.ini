PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="Uma rede /24 em IPv4 ou /64 em IPv6: o que um copiador obtém ao alternar entre endereços vizinhos."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_LABEL="Endereço do visitante"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_DESC="Deixe «Endereço da ligação», a menos que o site esteja atrás de um proxy: qualquer pessoa pode falsificar um cabeçalho."

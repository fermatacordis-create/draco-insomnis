PLG_SYSTEM_DRACOINSOMNIS_EVENTS_HELP="Guardadas durante 90 dias. Nunca palavras-passe. O CSV de um endereço tem tudo o que ele fez, pronto a anexar a uma denúncia de abuso ao fornecedor de rede."

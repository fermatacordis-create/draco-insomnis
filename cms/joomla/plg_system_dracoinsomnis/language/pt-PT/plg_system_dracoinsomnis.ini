PLG_SYSTEM_DRACOINSOMNIS="Sistema - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Trava registos falsos sem captchas, firewall de aplicação e limite de ritmo anticópia. Código aberto."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Trava registos falsos sem captchas: os robôs não obtêm conta, e cada tentativa suspeita fica guardada 90 dias como prova para uma denúncia de abuso. Nunca é enviado nada de volta ao atacante."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="O seu endereço tal como o plugin o vê: %1$s (endereço da ligação: %2$s). Se o site estiver atrás do Cloudflare ou de outro proxy e estes forem diferentes do seu endereço real, escolha a opção correspondente em «Endereço do visitante»."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Proteger os registos de utilizadores"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Acrescenta uma armadilha invisível e um selo assinado da página ao formulário de registo. Os robôs não obtêm conta; três tentativas de robô num dia bloqueiam o endereço durante uma semana."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Firewall"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Trava pedidos com forma de ataque (injeção na base de dados, leitura de ficheiros do servidor, execução de código, scripts em ligações) e scanners como o sqlmap ou o Nikto. Comece com «Apenas registar» e passe para «Bloquear» ao fim de alguns dias. Cinco ataques em 10 minutos bloqueiam o endereço durante uma semana; os endereços bloqueados continuam a poder ler o site, mas não a enviar. Os utilizadores que podem entrar na administração nunca são inspecionados. Saída de emergência: define('DRACO_WAF_OFF', true); em defines.php na raiz do site."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Limite de ritmo anticópia"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Quem pede mais páginas por minuto do que uma pessoa lê recebe «429 Too many requests» até o minuto acabar. Os utilizadores com sessão iniciada, os seus próprios endereços e os motores de pesquisa verificados por DNS (Google, Bing, Apple, Yandex) nunca são limitados."
PLG_SYSTEM_DRACOINSOMNIS_MODE_OFF="Desligado"
PLG_SYSTEM_DRACOINSOMNIS_MODE_LOG="Apenas registar: anotar o que travaria"
PLG_SYSTEM_DRACOINSOMNIS_MODE_BLOCK="Bloquear"

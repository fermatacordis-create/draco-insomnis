PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Proxies de confianza"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Solo las conexiones desde estas direcciones pueden indicar la dirección del visitante con una cabecera. Una dirección o rango por línea. Vacío: este servidor y las redes privadas. Los rangos de Cloudflare ya los conoce el plugin."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="Se ignora la cabecera: esta conexión (%s) no viene de Cloudflare ni de un proxy de confianza. Si tu proxy está en internet, añade sus direcciones en «Proxies de confianza»."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Países"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Tus visitantes pueden venir de muchos países, y un atacante cambia de país con una VPN. Filtra solo el acceso, las altas y los formularios, y empieza con «Solo registrar». Los administradores, las personas a las que dejas pasar y los buscadores nunca se filtran. Necesita el cortafuegos encendido (registrar o bloquear)."
PLG_SYSTEM_DRACOINSOMNIS_GEO_MODE="Filtro"
PLG_SYSTEM_DRACOINSOMNIS_GEO_REFUSE="Rechazar los países de la lista"
PLG_SYSTEM_DRACOINSOMNIS_GEO_ONLY="Solo los países de la lista"
PLG_SYSTEM_DRACOINSOMNIS_GEO_SCOPE="Dónde"
PLG_SYSTEM_DRACOINSOMNIS_GEO_SENSITIVE="Acceso, altas y formularios (recomendado)"
PLG_SYSTEM_DRACOINSOMNIS_GEO_SITE="Todo el sitio"
PLG_SYSTEM_DRACOINSOMNIS_GEO_ACTION="Qué hacer"
PLG_SYSTEM_DRACOINSOMNIS_GEO_COUNTRIES="Países (códigos de dos letras, p. ej. ES, FR, DE)"
PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="Geolocalización IP de DB-IP (db-ip.com, CC BY 4.0), descargada al encender el filtro y consultada en tu propio servidor: no se envía ninguna dirección a ningún sitio."
PLG_SYSTEM_DRACOINSOMNIS_GEO_DOWNLOADED="Lista de países descargada."
PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="No se pudo descargar la lista de países. El filtro no hace nada hasta tenerla; vuelve a guardar más tarde."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Cabeceras de seguridad"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="En las páginas públicas: sin adivinar tipos de archivo, sin que otros sitios te enmarquen, menos datos de procedencia, sin cámara, micrófono ni ubicación para contenido incrustado. Nunca una que ya se envíe."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Forzar HTTPS durante 6 meses (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Solo si todo el sitio funciona con HTTPS y va a seguir así: los navegadores lo recuerdan y rechazan HTTP hasta que caduque."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Bloquear una dirección o un rango"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Se aplica al guardar y después estos campos se vacían. Nunca un administrador ni tu propia dirección. Rangos como mucho /16 (IPv4) o /32 (IPv6)."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_VALUE="IP o rango (p. ej. 203.0.113.0/24)"

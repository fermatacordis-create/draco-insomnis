PLG_SYSTEM_DRACOINSOMNIS="Sistema - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Frena las altas falsas sin captchas, con cortafuegos y límite anti-copia. Código abierto."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Frena las altas falsas sin captchas: los bots no consiguen cuenta y cada intento sospechoso se guarda 90 días como prueba para denunciarlo. Nunca se envía nada de vuelta al atacante."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Tu dirección tal como la ve el plugin: %1$s (dirección de la conexión: %2$s). Si el sitio está detrás de Cloudflare u otro proxy y no coinciden con tu dirección real, elige la opción que corresponda en «Dirección del visitante»."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Proteger las altas de usuarios"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Añade una trampa invisible y un sello firmado de la página al formulario de alta. Los bots no consiguen cuenta; tres intentos de bot en un día bloquean la dirección una semana."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Cortafuegos"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Para las peticiones con forma de ataque (inyección en la base de datos, lectura de archivos del servidor, ejecución de código, scripts en enlaces) y los escáneres como sqlmap o Nikto. Empieza con «Solo registrar» y pasa a «Bloquear» al cabo de unos días. Cinco ataques en 10 minutos bloquean la dirección una semana; las direcciones bloqueadas pueden seguir viendo el sitio, pero no enviar nada. Nunca se inspecciona a quien puede entrar en la administración. Salida de emergencia: define('DRACO_WAF_OFF', true); en defines.php en la raíz del sitio."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Límite de ritmo anti-copia"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Quien pide más páginas por minuto de las que lee una persona recibe «429 Too many requests» hasta que acaba el minuto. Nunca se limita a los usuarios con sesión iniciada, a tus propias direcciones ni a los buscadores verificados por DNS (Google, Bing, Apple, Yandex)."
PLG_SYSTEM_DRACOINSOMNIS_MODE_OFF="Apagado"
PLG_SYSTEM_DRACOINSOMNIS_MODE_LOG="Solo registrar lo que pararía"
PLG_SYSTEM_DRACOINSOMNIS_MODE_BLOCK="Bloquear"
PLG_SYSTEM_DRACOINSOMNIS_RATE_IP_LABEL="Páginas por minuto, por dirección"
PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_LABEL="Páginas por minuto, por red"
PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="Una red /24 en IPv4 o /64 en IPv6: lo que usa un copiador cuando va cambiando entre direcciones vecinas."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_LABEL="Dirección del visitante"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_DESC="Deja «Dirección de la conexión» salvo que el sitio esté detrás de un proxy: cualquiera puede falsificar una cabecera."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_NONE="Dirección de la conexión (recomendado)"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_CF="Cloudflare (CF-Connecting-IP)"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_XFF="Otro proxy (X-Forwarded-For)"
PLG_SYSTEM_DRACOINSOMNIS_NETS_LABEL="Redes de servidores de alquiler"
PLG_SYSTEM_DRACOINSOMNIS_NETS_DESC="Un rango por línea (CIDR), que se suma a los que el plugin ya conoce. Estar en esta lista solo suma puntos: por sí sola nunca convierte a nadie en bot."
PLG_SYSTEM_DRACOINSOMNIS_AUTO_BLOCK="Automático: %d intentos de bot en 24 h"
PLG_SYSTEM_DRACOINSOMNIS_WAF_BLOCK="Cortafuegos: %d ataques en 10 minutos"
PLG_SYSTEM_DRACOINSOMNIS_REJECTED="No se ha podido completar el registro."
PLG_SYSTEM_DRACOINSOMNIS_BLOCKED_TITLE="Petición bloqueada"
PLG_SYSTEM_DRACOINSOMNIS_BLOCKED_TEXT="Esta petición se ha parado por motivos de seguridad. Si crees que es un error, contacta con el responsable del sitio."
PLG_SYSTEM_DRACOINSOMNIS_UNBLOCKED="Dirección desbloqueada."
PLG_SYSTEM_DRACOINSOMNIS_UNBLOCK="Desbloquear"
PLG_SYSTEM_DRACOINSOMNIS_BLOCKS="Direcciones bloqueadas"
PLG_SYSTEM_DRACOINSOMNIS_NO_BLOCKS="Ahora mismo no hay nada bloqueado."
PLG_SYSTEM_DRACOINSOMNIS_EVENTS="Últimos intentos sospechosos"
PLG_SYSTEM_DRACOINSOMNIS_EVENTS_HELP="Se guardan 90 días. Nunca contraseñas. El CSV de una dirección reúne todo lo que hizo, listo para adjuntarlo a una denuncia a su proveedor de red."
PLG_SYSTEM_DRACOINSOMNIS_NO_EVENTS="Todavía nada."

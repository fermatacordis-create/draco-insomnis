PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Cabeceras de seguridad"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="En las páginas públicas: sin adivinar tipos de archivo, sin que otros sitios te enmarquen, menos datos de procedencia, sin cámara, micrófono ni ubicación para contenido incrustado. Nunca una que ya se envíe."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Forzar HTTPS durante 6 meses (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Solo si todo el sitio funciona con HTTPS y va a seguir así: los navegadores lo recuerdan y rechazan HTTP hasta que caduque."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Longitud mínima de la contraseña"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="De 8 a 64 caracteres; con 0 quedan solo las reglas de Usuarios: Opciones. Se aplica al crear una cuenta o cambiar una contraseña."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Rechazar contraseñas filtradas"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Pregunta a Have I Been Pwned con k-anonimato: del sitio solo salen 5 caracteres del SHA-1 de la contraseña, nunca la contraseña. Si el servicio no responde en 3 segundos, la contraseña se acepta."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="La contraseña debe tener al menos %d caracteres."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Esta contraseña aparece en filtraciones de datos conocidas, así que los atacantes la prueban primero. Elige otra, por favor."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Bloquear una dirección o un rango"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Se aplica al guardar y después estos campos se vacían. Nunca un administrador ni tu propia dirección. Rangos como mucho /16 (IPv4) o /32 (IPv6)."

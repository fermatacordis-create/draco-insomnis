PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Solo las conexiones desde estas direcciones pueden indicar la dirección del visitante con una cabecera. Una dirección o rango por línea. Vacío: este servidor y las redes privadas. Los rangos de Cloudflare ya los conoce el plugin."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="Se ignora la cabecera: esta conexión (%s) no viene de Cloudflare ni de un proxy de confianza. Si tu proxy está en internet, añade sus direcciones en «Proxies de confianza»."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Países"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Tus visitantes pueden venir de muchos países, y un atacante cambia de país con una VPN. Filtra solo el acceso, las altas y los formularios, y empieza con «Solo registrar». Los administradores, las personas a las que dejas pasar y los buscadores nunca se filtran. Necesita el cortafuegos encendido (registrar o bloquear)."

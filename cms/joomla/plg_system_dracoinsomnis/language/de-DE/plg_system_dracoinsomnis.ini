PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="IP-Geolokalisierung von DB-IP (db-ip.com, CC BY 4.0), heruntergeladen, wenn Sie den Filter einschalten, und auf Ihrem eigenen Server abgefragt: Keine Adresse wird irgendwohin gesendet."
PLG_SYSTEM_DRACOINSOMNIS_GEO_DOWNLOADED="Länderliste heruntergeladen."
PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="Die Länderliste konnte nicht heruntergeladen werden. Der Filter tut nichts, bis sie da ist; speichern Sie später erneut."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Sicherheits-Header"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Auf öffentlichen Seiten: kein Erraten von Dateitypen, keine Einbettung in fremde Websites, weniger Herkunftsdaten, keine Kamera, kein Mikrofon und kein Standort für eingebettete Inhalte. Nie einer, der schon gesendet wird."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="HTTPS für 6 Monate erzwingen (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Nur wenn die ganze Website über HTTPS läuft und das so bleibt: Browser merken es sich und lehnen HTTP ab, bis es abläuft."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Mindestlänge des Passworts"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="8 bis 64 Zeichen; 0 lässt nur die Regeln unter Benutzer: Optionen. Gilt beim Anlegen eines Kontos oder beim Ändern eines Passworts."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Passwörter aus Datenlecks ablehnen"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Fragt Have I Been Pwned mit k-Anonymität: Nur 5 Zeichen des SHA-1 des Passworts verlassen die Website, nie das Passwort. Antwortet der Dienst nicht innerhalb von 3 Sekunden, wird das Passwort akzeptiert."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="Das Passwort muss mindestens %d Zeichen haben."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Dieses Passwort taucht in bekannten Datenlecks auf, deshalb probieren Angreifer es zuerst. Bitte wähle ein anderes."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Eine Adresse oder einen Bereich sperren"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Wird beim Speichern angewendet, danach werden diese Felder geleert. Nie ein Administrator und nie Ihre eigene Adresse. Bereiche nicht größer als /16 (IPv4) oder /32 (IPv6)."

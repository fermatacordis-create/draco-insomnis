PLG_SYSTEM_DRACOINSOMNIS="System - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Stoppt gefälschte Registrierungen ohne Captchas, Anwendungs-Firewall und Anti-Kopier-Tempolimit. Open Source."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Stoppt gefälschte Registrierungen ohne Captchas: Bots bekommen kein Konto, und jeder verdächtige Versuch wird 90 Tage als Beweis für eine Missbrauchsmeldung aufbewahrt. Dem Angreifer wird nie etwas zurückgeschickt."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Ihre Adresse, wie das Plugin sie sieht: %1$s (Verbindungsadresse: %2$s). Wenn die Website hinter Cloudflare oder einem anderen Proxy liegt und diese von Ihrer echten Adresse abweichen, wählen Sie die passende Option unter „Besucheradresse“."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Benutzerregistrierungen schützen"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Fügt dem Registrierungsformular eine unsichtbare Falle und einen signierten Seitenstempel hinzu. Bots bekommen kein Konto; drei Bot-Versuche an einem Tag sperren die Adresse für eine Woche."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Firewall"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Stoppt Anfragen in Form eines Angriffs (Datenbank-Injektion, Lesen von Serverdateien, Ausführen von Code, Skripte in Links) und Scanner wie sqlmap oder Nikto. Beginnen Sie mit „Nur protokollieren“ und wechseln Sie nach ein paar Tagen zu „Blockieren“. Fünf Angriffe in 10 Minuten sperren die Adresse für eine Woche; gesperrte Adressen können die Website weiter lesen, aber nichts absenden. Benutzer, die sich im Administrator anmelden können, werden nie geprüft. Notausgang: define('DRACO_WAF_OFF', true); in defines.php im Stammverzeichnis der Website."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Anti-Kopier-Tempolimit"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Wer mehr Seiten pro Minute abruft, als ein Mensch liest, bekommt „429 Too many requests“, bis die Minute vorbei ist. Angemeldete Benutzer, Ihre eigenen Adressen und per DNS geprüfte Suchmaschinen (Google, Bing, Apple, Yandex) werden nie begrenzt."
PLG_SYSTEM_DRACOINSOMNIS_MODE_OFF="Aus"
PLG_SYSTEM_DRACOINSOMNIS_MODE_LOG="Nur protokollieren: festhalten, was gestoppt würde"
PLG_SYSTEM_DRACOINSOMNIS_MODE_BLOCK="Blockieren"

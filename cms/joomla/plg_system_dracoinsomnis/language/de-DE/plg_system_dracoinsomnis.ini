PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_LABEL="Seiten pro Minute, pro Netz"
PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="Ein /24-Netz bei IPv4 oder ein /64 bei IPv6: das, was ein Scraper bekommt, wenn er zwischen benachbarten Adressen wechselt."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_LABEL="Besucheradresse"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_DESC="Lassen Sie „Verbindungsadresse“, außer die Website liegt hinter einem Proxy: einen Header kann jeder fälschen."

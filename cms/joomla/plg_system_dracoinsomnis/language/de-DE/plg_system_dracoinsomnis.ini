PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Vertrauenswürdige Proxys"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Nur Verbindungen von diesen Adressen dürfen die Besucheradresse per Header setzen. Eine Adresse oder ein Bereich pro Zeile. Leer: dieser Server und private Netze. Die Bereiche von Cloudflare sind schon bekannt."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="Der Header wird ignoriert: Diese Verbindung (%s) kommt weder von Cloudflare noch von einem vertrauenswürdigen Proxy. Wenn Ihr Proxy im Internet steht, tragen Sie seine Adressen unter „Vertrauenswürdige Proxys“ ein."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Länder"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Ihre Besucher können aus vielen Ländern kommen, und ein Angreifer wechselt das Land mit einem VPN. Filtern Sie nur Anmeldung, Registrierung und Formulare, und beginnen Sie mit „Nur protokollieren“. Administratoren, Personen, die Sie durchlassen, und Suchmaschinen werden nie gefiltert. Die Firewall muss an sein (protokollieren oder blockieren)."

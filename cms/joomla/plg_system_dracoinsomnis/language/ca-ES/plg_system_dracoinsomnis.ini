PLG_SYSTEM_DRACOINSOMNIS="Sistema - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Atura els registres falsos sense captcha, tallafoc d’aplicació i límit de ritme anticòpia. Codi obert."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Atura els registres falsos sense captcha: els bots no obtenen compte i cada intent sospitós es guarda 90 dies com a prova per a una denúncia d’abús. Mai no s’envia res a l’atacant."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="La teva adreça tal com la veu el connector: %1$s (adreça de la connexió: %2$s). Si el lloc és darrere de Cloudflare o d’un altre proxy i no coincideixen amb la teva adreça real, tria l’opció corresponent a «IP del visitant»."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Protegir els registres d’usuaris"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Afegeix una trampa invisible i un segell signat de la pàgina al formulari de registre. Els bots no obtenen compte; tres intents de bot en un dia bloquegen l’adreça una setmana."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Tallafoc"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Atura les peticions amb forma d’atac (injecció a la base de dades, lectura de fitxers del servidor, execució de codi, scripts als enllaços) i els escàners com sqlmap o Nikto. Comença amb «Només registrar» i passa a «Bloqueja» al cap d’uns dies. Cinc atacs en 10 minuts bloquegen l’adreça una setmana; les adreces bloquejades poden continuar llegint el lloc, però no enviar res. Els usuaris que poden entrar a l’administració no s’inspeccionen mai. Sortida d’emergència: define('DRACO_WAF_OFF', true); a defines.php a l’arrel del lloc."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Límit de ritme anticòpia"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Qui demana més pàgines per minut de les que llegeix una persona rep «429 Too many requests» fins que acaba el minut. Els usuaris amb la sessió iniciada, les teves pròpies adreces i els cercadors verificats per DNS (Google, Bing, Apple, Yandex) no es limiten mai."

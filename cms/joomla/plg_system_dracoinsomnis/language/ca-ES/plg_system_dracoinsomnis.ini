PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="Geolocalització d’IP de DB-IP (db-ip.com, CC BY 4.0), baixada quan actives el filtre i consultada al teu propi servidor: no s’envia cap adreça enlloc."
PLG_SYSTEM_DRACOINSOMNIS_GEO_DOWNLOADED="Llista de països baixada."
PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="No s’ha pogut baixar la llista de països. El filtre no fa res fins que hi sigui; torna a desar més tard."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Capçaleres de seguretat"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="A les pàgines públiques: sense endevinar tipus de fitxer, sense incrustar-les en altres llocs, menys dades de procedència, sense càmera, micròfon ni ubicació per al contingut incrustat. Mai una que ja s’enviï."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Forçar HTTPS durant 6 mesos (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Només si tot el lloc funciona amb HTTPS i hi continuarà: els navegadors ho recorden i rebutgen HTTP fins que caduqui."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Longitud mínima de la contrasenya"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="De 8 a 64 caràcters; amb 0 queden només les regles d’Usuaris: Opcions. S’aplica en crear un compte o canviar una contrasenya."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Rebutjar contrasenyes trobades en filtracions de dades"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Pregunta a Have I Been Pwned amb k-anonimat: del lloc només en surten 5 caràcters de l’SHA-1 de la contrasenya, mai la contrasenya. Si el servei no respon en 3 segons, la contrasenya s’accepta."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="La contrasenya ha de tenir almenys %d caràcters."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Aquesta contrasenya apareix en filtracions de dades conegudes, i els atacants la proven primer. Tria'n una altra, si us plau."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Bloquejar una adreça o un rang"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="S’aplica en desar i després aquests camps es buiden. Mai un administrador ni la teva pròpia adreça. Rangs no més amplis que /16 (IPv4) o /32 (IPv6)."

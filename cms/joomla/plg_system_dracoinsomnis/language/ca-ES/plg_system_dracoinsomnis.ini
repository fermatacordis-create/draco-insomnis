PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Proxies de confiança"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Només les connexions d’aquestes adreces poden fixar l’adreça del visitant amb una capçalera. Una adreça o rang per línia. Buit: aquest servidor i les xarxes privades. Els rangs de Cloudflare ja són coneguts."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="La capçalera s’ignora: aquesta connexió (%s) no ve de Cloudflare ni d’un proxy de confiança. Si el teu proxy és a internet, afegeix-ne les adreces a «Proxies de confiança»."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Països"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Els teus visitants poden venir de molts països, i un atacant canvia de país amb una VPN. Filtra només l’inici de sessió, el registre i els formularis, i comença amb «Només registrar». Els administradors, les persones que deixes passar i els cercadors no es filtren mai. Cal el tallafoc engegat (registrar o bloquejar)."

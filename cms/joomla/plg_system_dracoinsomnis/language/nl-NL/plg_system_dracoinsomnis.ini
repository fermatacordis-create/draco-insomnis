PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="IP-geolocatie door DB-IP (db-ip.com, CC BY 4.0), gedownload wanneer u het filter aanzet en opgezocht op uw eigen server: er wordt nergens een adres naartoe gestuurd."
PLG_SYSTEM_DRACOINSOMNIS_GEO_DOWNLOADED="Landenlijst gedownload."
PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="De landenlijst kon niet worden gedownload. Het filter doet niets tot die er is; sla later opnieuw op."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Beveiligingsheaders"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Op openbare pagina’s: geen raden van bestandstypen, niet insluiten in andere sites, minder herkomstgegevens, geen camera, microfoon of locatie voor ingesloten inhoud. Nooit een header die al wordt verzonden."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="HTTPS 6 maanden afdwingen (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Alleen als de hele site via HTTPS werkt en dat zo blijft: browsers onthouden het en weigeren HTTP tot het verloopt."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Minimale wachtwoordlengte"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="8 tot 64 tekens; 0 laat alleen de regels van Gebruikers: Opties. Geldt bij het aanmaken van een account of het wijzigen van een wachtwoord."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Wachtwoorden uit datalekken weigeren"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Vraagt Have I Been Pwned met k-anonimiteit: alleen 5 tekens van de SHA-1 van het wachtwoord verlaten de site, nooit het wachtwoord. Antwoordt de dienst niet binnen 3 seconden, dan wordt het wachtwoord geaccepteerd."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="Het wachtwoord moet minstens %d tekens hebben."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Dit wachtwoord komt voor in bekende datalekken, dus aanvallers proberen het als eerste. Kies alsjeblieft een ander."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Een adres of bereik blokkeren"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Toegepast bij opslaan, daarna worden deze velden geleegd. Nooit een beheerder, en nooit uw eigen adres. Bereiken niet breder dan /16 (IPv4) of /32 (IPv6)."

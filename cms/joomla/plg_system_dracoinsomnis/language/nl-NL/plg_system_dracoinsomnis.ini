PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Vertrouwde proxy’s"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Alleen verbindingen van deze adressen mogen het bezoekersadres via een header doorgeven. Eén adres of bereik per regel. Leeg: deze server en privénetwerken. De bereiken van Cloudflare zelf zijn al bekend."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="De header wordt genegeerd: deze verbinding (%s) komt niet van Cloudflare of van een vertrouwde proxy. Staat uw proxy op internet, voeg dan zijn adressen toe bij ‘Vertrouwde proxy’s’."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Landen"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Uw bezoekers kunnen uit veel landen komen, en een aanvaller wisselt van land met een VPN. Filter alleen inloggen, registreren en formulieren, en begin met ‘Alleen loggen’. Beheerders, mensen die u doorlaat en zoekmachines worden nooit gefilterd. De firewall moet aan staan (loggen of blokkeren)."

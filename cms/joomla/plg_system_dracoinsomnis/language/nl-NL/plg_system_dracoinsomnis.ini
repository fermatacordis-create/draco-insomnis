PLG_SYSTEM_DRACOINSOMNIS="Systeem - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Stopt nepregistraties zonder captcha’s, applicatiefirewall en tempolimiet tegen kopiëren. Open source."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Stopt nepregistraties zonder captcha’s: bots krijgen geen account en elke verdachte poging wordt 90 dagen bewaard als bewijs voor een misbruikmelding. Er wordt nooit iets teruggestuurd naar de aanvaller."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Uw adres zoals de plugin het ziet: %1$s (verbindingsadres: %2$s). Als de site achter Cloudflare of een andere proxy staat en deze verschillen van uw echte adres, kies dan de passende optie bij ‘Bezoekersadres’."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Gebruikersregistraties beschermen"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Voegt een onzichtbare val en een ondertekende paginastempel toe aan het registratieformulier. Bots krijgen geen account; drie botpogingen op één dag blokkeren het adres een week."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Firewall"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Stopt verzoeken die op een aanval lijken (database-injectie, serverbestanden lezen, code uitvoeren, scripts in links) en scanners zoals sqlmap of Nikto. Begin met ‘Alleen loggen’ en ga na een paar dagen naar ‘Blokkeren’. Vijf aanvallen in 10 minuten blokkeren het adres een week; geblokkeerde adressen kunnen de site nog lezen, maar niets versturen. Gebruikers die in de beheeromgeving kunnen inloggen worden nooit gecontroleerd. Nooduitgang: define('DRACO_WAF_OFF', true); in defines.php in de hoofdmap van de site."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Tempolimiet tegen kopiëren"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Wie meer pagina’s per minuut opvraagt dan een mens leest, krijgt ‘429 Too many requests’ tot de minuut voorbij is. Ingelogde gebruikers, uw eigen adressen en via DNS gecontroleerde zoekmachines (Google, Bing, Apple, Yandex) worden nooit beperkt."
PLG_SYSTEM_DRACOINSOMNIS_MODE_OFF="Uit"
PLG_SYSTEM_DRACOINSOMNIS_MODE_LOG="Alleen loggen: noteren wat het zou stoppen"
PLG_SYSTEM_DRACOINSOMNIS_MODE_BLOCK="Blokkeren"

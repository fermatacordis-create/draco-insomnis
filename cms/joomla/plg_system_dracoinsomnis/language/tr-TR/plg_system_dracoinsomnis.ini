PLG_SYSTEM_DRACOINSOMNIS="Sistem - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Captcha olmadan sahte kayıtları durdurur; uygulama güvenlik duvarı ve kopyalamaya karşı hız sınırı. Açık kaynak."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Captcha olmadan sahte kayıtları durdurur: botlar hesap alamaz ve her şüpheli deneme kötüye kullanım bildirimi için kanıt olarak 90 gün saklanır. Saldırgana asla bir şey geri gönderilmez."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Eklentinin gördüğü adresiniz: %1$s (bağlantı adresi: %2$s). Site Cloudflare veya başka bir proxy arkasındaysa ve bunlar gerçek adresinizden farklıysa, “Ziyaretçi adresi” bölümünde uygun seçeneği seçin."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Kullanıcı kayıtlarını koru"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Kayıt formuna görünmez bir tuzak ve imzalı bir sayfa damgası ekler. Botlar hesap alamaz; bir günde üç bot denemesi adresi bir hafta engeller."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Güvenlik duvarı"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Saldırı biçimindeki istekleri (veritabanı enjeksiyonu, sunucu dosyalarını okuma, kod çalıştırma, bağlantılarda betik) ve sqlmap ya da Nikto gibi tarayıcıları durdurur. “Yalnızca kaydet” ile başlayın ve birkaç gün sonra “Engelle”ye geçin. 10 dakikada beş saldırı adresi bir hafta engeller; engellenen adresler siteyi okumaya devam edebilir ama bir şey gönderemez. Yönetim paneline girebilen kullanıcılar asla denetlenmez. Acil çıkış: sitenin kök dizinindeki defines.php dosyasına define('DRACO_WAF_OFF', true); ekleyin."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Kopyalamaya karşı hız sınırı"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Bir insanın okuyabileceğinden fazla sayfayı dakikada isteyen, dakika bitene kadar “429 Too many requests” alır. Oturum açmış kullanıcılar, kendi adresleriniz ve DNS ile doğrulanmış arama motorları (Google, Bing, Apple, Yandex) asla sınırlanmaz."

PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="Một mạng /24 với IPv4 hoặc /64 với IPv6: phạm vi một công cụ cào dữ liệu có được khi xoay vòng các địa chỉ liền kề."

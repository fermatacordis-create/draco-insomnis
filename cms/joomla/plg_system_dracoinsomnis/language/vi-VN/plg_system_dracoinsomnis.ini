PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Quốc gia"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Khách truy cập của bạn có thể đến từ nhiều quốc gia, và kẻ tấn công đổi quốc gia bằng VPN. Chỉ lọc đăng nhập, đăng ký và biểu mẫu, và bắt đầu với “Chỉ ghi lại”. Quản trị viên, người bạn cho qua và công cụ tìm kiếm không bao giờ bị lọc. Cần bật tường lửa (ghi lại hoặc chặn)."

PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Chỉ các kết nối từ những địa chỉ này mới được đặt địa chỉ khách truy cập qua header. Mỗi dòng một địa chỉ hoặc dải. Để trống: máy chủ này và các mạng riêng. Các dải của Cloudflare đã được biết sẵn."

PLG_SYSTEM_DRACOINSOMNIS="Hệ thống - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Chặn đăng ký giả mà không cần captcha, tường lửa ứng dụng và giới hạn tốc độ chống sao chép. Mã nguồn mở."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Chặn đăng ký giả mà không cần captcha: bot không có được tài khoản, và mọi lần thử đáng ngờ được lưu 90 ngày làm bằng chứng cho báo cáo lạm dụng. Không bao giờ gửi lại gì cho kẻ tấn công."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Địa chỉ của bạn theo plugin thấy: %1$s (địa chỉ kết nối: %2$s). Nếu trang web nằm sau Cloudflare hoặc proxy khác và hai địa chỉ này khác địa chỉ thật của bạn, hãy chọn tùy chọn phù hợp trong “Địa chỉ khách truy cập”."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Bảo vệ đăng ký người dùng"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Thêm một cái bẫy vô hình và một con dấu trang có chữ ký vào biểu mẫu đăng ký. Bot không có được tài khoản; ba lần thử của bot trong một ngày sẽ chặn địa chỉ trong một tuần."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Tường lửa"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Chặn các yêu cầu có dạng tấn công (chèn vào cơ sở dữ liệu, đọc tệp máy chủ, chạy mã, script trong liên kết) và các công cụ quét như sqlmap hay Nikto. Hãy bắt đầu với “Chỉ ghi lại” và chuyển sang “Chặn” sau vài ngày. Năm cuộc tấn công trong 10 phút sẽ chặn địa chỉ một tuần; địa chỉ bị chặn vẫn đọc được trang nhưng không gửi được. Người dùng có thể đăng nhập trang quản trị không bao giờ bị kiểm tra. Lối thoát khẩn cấp: define('DRACO_WAF_OFF', true); trong defines.php ở thư mục gốc của trang."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Giới hạn tốc độ chống sao chép"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Ai yêu cầu nhiều trang mỗi phút hơn lượng một người đọc sẽ nhận “429 Too many requests” cho đến hết phút đó. Người dùng đã đăng nhập, địa chỉ của chính bạn và công cụ tìm kiếm được xác minh qua DNS (Google, Bing, Apple, Yandex) không bao giờ bị giới hạn."

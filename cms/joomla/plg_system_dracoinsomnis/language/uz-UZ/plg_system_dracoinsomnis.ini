PLG_SYSTEM_DRACOINSOMNIS="Tizim - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Soxta roʻyxatdan oʻtishlarni captchasiz, ilova firewalli va nusxa koʻchirishga qarshi tezlik cheklovi bilan toʻxtatadi. Ochiq kodli."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Soxta roʻyxatdan oʻtishlarni captchasiz toʻxtatadi: botlar hisob ocholmaydi, har bir shubhali urinish esa suiisteʻmol haqida xabar berish uchun dalil sifatida 90 kun saqlanadi. Hujumchiga hech narsa qaytarib yuborilmaydi."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Plagin koʻrayotgan manzilingiz: %1$s (ulanish manzili: %2$s). Agar sayt Cloudflare yoki boshqa proxy ortida boʻlsa va bular haqiqiy manzilingizdan farq qilsa, «Visitor address» boʻlimida mos variantni tanlang."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Foydalanuvchilar roʻyxatdan oʻtishini himoya qilish"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Roʻyxatdan oʻtish shakliga koʻrinmas tuzoq va imzolangan sahifa muhrini qoʻshadi. Botlar hisob ocholmaydi; bir kunda uchta bot urinishi manzilni bir haftaga bloklaydi."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Firewall"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Hujum shaklidagi soʻrovlarni (maʻlumotlar bazasiga inyeksiya, server fayllarini oʻqish, kod ishga tushirish, havolalardagi skriptlar) va sqlmap yoki Nikto kabi skanerlarni toʻxtatadi. «Log only» bilan boshlang va bir necha kundan keyin «Bloklash» ga oʻting. 10 daqiqada beshta hujum manzilni bir haftaga bloklaydi; bloklangan manzillar saytni oʻqishda davom etishi mumkin, lekin hech narsa yubora olmaydi. Administratorga kira oladigan foydalanuvchilar hech qachon tekshirilmaydi. Favqulodda chiqish: define('DRACO_WAF_OFF', true); sayt ildizidagi defines.php faylida."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Nusxa koʻchirishga qarshi tezlik cheklovi"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Bir daqiqada odam oʻqiy oladiganidan koʻp sahifa soʻraganlarga daqiqa tugaguncha '429 Too many requests' beriladi. Kirgan foydalanuvchilar, oʻz manzillaringiz va DNS orqali tasdiqlangan qidiruv tizimlari (Google, Bing, Apple, Yandex) hech qachon cheklanmaydi."

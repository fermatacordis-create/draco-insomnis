PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Faqat shu manzillardan kelgan ulanishlar header orqali tashrif buyuruvchi manzilini belgilashi mumkin. Har bir qatorda bitta manzil yoki diapazon. Boʻsh boʻlsa: shu server va shaxsiy tarmoqlar. Cloudflare ning oʻz diapazonlari allaqachon maʻlum."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="Header eʻtiborga olinmaydi: bu ulanish (%s) Cloudflare dan yoki ishonchli proxydan kelmagan. Agar proxyingiz internetda boʻlsa, uning manzillarini 'Trusted proxies' ga qoʻshing."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Mamlakatlar"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Tashrif buyuruvchilaringiz koʻp mamlakatlardan kelishi mumkin, hujumchi esa VPN bilan mamlakatni oʻzgartiradi. Faqat kirish, roʻyxatdan oʻtish va shakllarni filtrlang va «Log only» bilan boshlang. Administratorlar, oʻtkazgan odamlaringiz va qidiruv tizimlari hech qachon filtrlanmaydi. Firewall yoqilgan boʻlishi kerak (log yoki bloklash)."

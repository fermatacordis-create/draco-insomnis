PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Xavfsizlik headerlari"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Ommaviy sahifalarda: fayl turlarini aniqlash yoʻq, boshqa saytlar tomonidan ramkaga olish yoʻq, kamroq yoʻnaltiruvchi maʻlumot, joylashtirilgan kontent uchun kamera, mikrofon yoki joylashuv yoʻq. Allaqachon yuborilgan header hech qachon yuborilmaydi."

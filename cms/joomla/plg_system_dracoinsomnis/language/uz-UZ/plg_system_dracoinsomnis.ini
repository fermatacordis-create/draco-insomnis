PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="8 dan 64 gacha belgi; 0 boʻlsa, faqat Users: Options qoidalari qoladi. Hisob yaratilganda yoki password oʻzgartirilganda qoʻllanadi."

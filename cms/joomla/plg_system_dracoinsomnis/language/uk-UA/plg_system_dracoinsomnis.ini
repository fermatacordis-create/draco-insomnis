PLG_SYSTEM_DRACOINSOMNIS="Система - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Зупиняє фальшиві реєстрації без капчі, брандмауер застосунку й обмеження темпу проти копіювання. Відкритий код."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Зупиняє фальшиві реєстрації без капчі: боти не отримують облікового запису, а кожна підозріла спроба зберігається 90 днів як доказ для скарги про зловживання. Нападникові ніколи нічого не надсилається у відповідь."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Ваша адреса, як її бачить плагін: %1$s (адреса з'єднання: %2$s). Якщо сайт працює за Cloudflare чи іншим проксі і ці адреси відрізняються від вашої справжньої, виберіть відповідний варіант у «Адреса відвідувача»."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Захищати реєстрацію користувачів"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Додає до форми реєстрації невидиму пастку й підписану мітку сторінки. Боти не отримують облікового запису; три спроби бота за день блокують адресу на тиждень."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Брандмауер"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Зупиняє запити, схожі на атаку (впровадження в базу даних, читання файлів сервера, виконання коду, скрипти в посиланнях), і сканери на кшталт sqlmap чи Nikto. Почніть із «Лише журнал» і через кілька днів перейдіть на «Блокувати». П'ять атак за 10 хвилин блокують адресу на тиждень; заблоковані адреси можуть і далі читати сайт, але не надсилати дані. Користувачі, які можуть увійти до адмінпанелі, ніколи не перевіряються. Аварійний вихід: define('DRACO_WAF_OFF', true); у defines.php у корені сайту."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Обмеження темпу проти копіювання"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Хто запитує більше сторінок за хвилину, ніж читає людина, отримує «429 Too many requests» до кінця хвилини. Користувачі, що увійшли, ваші власні адреси й пошукові системи, перевірені через DNS (Google, Bing, Apple, Yandex), ніколи не обмежуються."

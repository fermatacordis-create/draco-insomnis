PLG_SYSTEM_DRACOINSOMNIS="سیستم - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. ثبت‌نام‌های جعلی را بدون کپچا متوقف می‌کند، با دیوار آتش برنامه و محدودیت سرعت ضد کپی. متن‌باز."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="ثبت‌نام‌های جعلی را بدون کپچا متوقف می‌کند: ربات‌ها حساب نمی‌گیرند و هر تلاش مشکوک ۹۰ روز به‌عنوان مدرک برای گزارش سوءاستفاده نگه داشته می‌شود. هرگز چیزی برای مهاجم پس فرستاده نمی‌شود."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="نشانی شما از دید افزونه: %1$s (نشانی اتصال: %2$s). اگر سایت پشت Cloudflare یا پراکسی دیگری است و این‌ها با نشانی واقعی شما فرق دارند، گزینهٔ مناسب را در «نشانی بازدیدکننده» انتخاب کنید."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="محافظت از ثبت‌نام کاربران"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="یک تله نامرئی و یک مهر امضاشدهٔ صفحه به فرم ثبت‌نام اضافه می‌کند. ربات‌ها حساب نمی‌گیرند؛ سه تلاش ربات در یک روز آن نشانی را یک هفته مسدود می‌کند."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="دیوار آتش"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="درخواست‌هایی را که شکل حمله دارند (تزریق به پایگاه داده، خواندن پرونده‌های سرور، اجرای کد، اسکریپت در پیوندها) و پویشگرهایی مانند sqlmap یا Nikto را متوقف می‌کند. با «فقط ثبت» شروع کنید و پس از چند روز به «مسدود کردن» بروید. پنج حمله در ۱۰ دقیقه نشانی را یک هفته مسدود می‌کند؛ نشانی‌های مسدودشده هنوز می‌توانند سایت را بخوانند، اما نمی‌توانند چیزی بفرستند. کاربرانی که می‌توانند به بخش مدیریت وارد شوند هرگز بررسی نمی‌شوند. راه خروج اضطراری: define('DRACO_WAF_OFF', true); در defines.php در ریشهٔ سایت."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="محدودیت سرعت ضد کپی"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="هر که در دقیقه بیش از آنچه یک انسان می‌خواند صفحه بخواهد، تا پایان آن دقیقه «429 Too many requests» می‌گیرد. کاربران واردشده، نشانی‌های خودتان و موتورهای جست‌وجوی تأییدشده با DNS (Google، Bing، Apple، Yandex) هرگز محدود نمی‌شوند."

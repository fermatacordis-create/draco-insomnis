PLG_SYSTEM_DRACOINSOMNIS_NETS_LABEL="Mga network ng inuupahang server"
PLG_SYSTEM_DRACOINSOMNIS_NETS_DESC="Isang saklaw bawat linya (CIDR), idinadagdag sa mga alam na ng plugin. Ang pagiging nasa listahang ito ay nagdadagdag lang ng puntos: mag-isa, hindi nito ginagawang bot ang sinuman."

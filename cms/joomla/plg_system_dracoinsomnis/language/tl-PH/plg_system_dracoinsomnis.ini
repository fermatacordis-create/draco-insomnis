PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Mga pinagkakatiwalaang proxy"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Ang mga koneksyon lang mula sa mga address na ito ang puwedeng magtakda ng address ng bisita sa pamamagitan ng header. Isang address o saklaw bawat linya. Walang laman: ang server na ito at mga pribadong network. Alam na ang sariling mga saklaw ng Cloudflare."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="Hindi pinapansin ang header: ang koneksyong ito (%s) ay hindi galing sa Cloudflare o sa pinagkakatiwalaang proxy. Kung nasa internet ang proxy mo, idagdag ang mga address nito sa “Mga pinagkakatiwalaang proxy”."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Mga bansa"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Maaaring galing sa maraming bansa ang mga bisita mo, at nagpapalit ng bansa ang umaatake gamit ang VPN. Salain lang ang pag-log in, pagpaparehistro at mga form, at magsimula sa “Itala lang”. Hindi kailanman sinasala ang mga administrator, ang mga taong pinadaan mo at ang mga search engine. Kailangang naka-on ang firewall (itala o harangan)."
PLG_SYSTEM_DRACOINSOMNIS_GEO_MODE="Filter"
PLG_SYSTEM_DRACOINSOMNIS_GEO_REFUSE="Tanggihan ang mga nakalistang bansa"
PLG_SYSTEM_DRACOINSOMNIS_GEO_ONLY="Ang mga nakalistang bansa lang"
PLG_SYSTEM_DRACOINSOMNIS_GEO_SCOPE="Saan"
PLG_SYSTEM_DRACOINSOMNIS_GEO_SENSITIVE="Pag-login, pagpaparehistro at mga form (inirerekomenda)"
PLG_SYSTEM_DRACOINSOMNIS_GEO_SITE="Ang buong site"
PLG_SYSTEM_DRACOINSOMNIS_GEO_ACTION="Ano ang gagawin"
PLG_SYSTEM_DRACOINSOMNIS_GEO_COUNTRIES="Mga bansa (dalawang-titik na code, hal. ES, FR, DE)"
PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="IP geolocation mula sa DB-IP (db-ip.com, CC BY 4.0), dina-download kapag in-on mo ang filter at hinahanap sa sarili mong server: walang address na ipinapadala kahit saan."
PLG_SYSTEM_DRACOINSOMNIS_GEO_DOWNLOADED="Na-download ang listahan ng mga bansa."
PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="Hindi ma-download ang listahan ng mga bansa. Walang ginagawa ang filter hangga’t wala ito; i-save muli mamaya."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Mga header ng seguridad"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Sa mga pampublikong pahina: walang panghuhula ng uri ng file, walang pag-embed sa ibang site, mas kaunting datos ng pinanggalingan, walang camera, mikropono o lokasyon para sa naka-embed na nilalaman. Hindi kailanman ang header na naipadala na."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Pilitin ang HTTPS nang 6 na buwan (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Kapag gumagana lang ang buong site sa HTTPS at patuloy na gagana: tinatandaan ito ng mga browser at tinatanggihan ang HTTP hanggang mag-expire."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Pinakamaikling haba ng password"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="Mula 8 hanggang 64 na karakter; ang 0 ay nag-iiwan lang ng mga patakaran ng Users: Options. Ipinapatupad kapag gumagawa ng account o nagpapalit ng password."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Tanggihan ang mga password na nakita sa mga data breach"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Nagtatanong sa Have I Been Pwned gamit ang k-anonymity: 5 karakter lang ng SHA-1 ng password ang lumalabas sa site, hindi kailanman ang password. Kung hindi sumagot ang serbisyo sa loob ng 3 segundo, tinatanggap ang password."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="Dapat may hindi bababa sa %d na character ang password."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Lumalabas ang password na ito sa mga kilalang data breach, kaya ito ang unang sinusubukan ng mga umaatake. Pumili ng iba, pakiusap."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Harangan ang isang address o saklaw"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Ipinapatupad kapag nag-save ka, saka binubura ang mga field na ito. Hindi kailanman ang administrator, at hindi rin ang sarili mong address. Mga saklaw na hindi lalawak sa /16 (IPv4) o /32 (IPv6)."

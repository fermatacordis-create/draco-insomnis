PLG_SYSTEM_DRACOINSOMNIS_REVIEW_SUBJECT="[%s] May humihiling na suriin mo ang isang harang ng firewall"
PLG_SYSTEM_DRACOINSOMNIS_REVIEW_BODY="Humihingi ng pagsusuri ang isang bisitang pinigilan ng firewall. Buksan ang plugin na Draco Insomnis para padaanin siya o hindi."
PLG_SYSTEM_DRACOINSOMNIS_REJECTED="Hindi makumpleto ang pagpaparehistro."
PLG_SYSTEM_DRACOINSOMNIS_BLOCKED_TITLE="Hinarang ang kahilingan"
PLG_SYSTEM_DRACOINSOMNIS_BLOCKED_TEXT="Pinigilan ang kahilingang ito dahil sa seguridad. Kung sa tingin mo ay pagkakamali ito, makipag-ugnayan sa may-ari ng site."

PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_LABEL="Mga pahina bawat minuto, bawat network"
PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="Isang /24 na network sa IPv4 o /64 sa IPv6: ang nakukuha ng scraper kapag nagpapalit-palit ng magkakatabing address."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_LABEL="Address ng bisita"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_DESC="Iwanan ang “Address ng koneksyon” maliban kung nasa likod ng proxy ang site: kayang pekein ninuman ang isang header."

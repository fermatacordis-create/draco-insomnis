PLG_SYSTEM_DRACOINSOMNIS="Sistema - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Pinipigilan ang mga pekeng pagpaparehistro nang walang captcha, may firewall ng application at limitasyon sa bilis laban sa pangongopya. Open source."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Pinipigilan ang mga pekeng pagpaparehistro nang walang captcha: hindi nakakakuha ng account ang mga bot, at bawat kahina-hinalang pagtatangka ay iniimbak nang 90 araw bilang ebidensya para sa ulat ng pang-aabuso. Walang anumang ibinabalik sa umaatake."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Ang address mo ayon sa nakikita ng plugin: %1$s (address ng koneksyon: %2$s). Kung ang site ay nasa likod ng Cloudflare o ibang proxy at iba ang mga ito sa totoong address mo, piliin ang katugmang opsyon sa “Address ng bisita”."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Protektahan ang pagpaparehistro ng user"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Nagdadagdag ng di-nakikitang bitag at pinirmahang tatak ng pahina sa form ng pagpaparehistro. Walang account ang mga bot; tatlong pagtatangka ng bot sa isang araw ay haharang sa address nang isang linggo."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Firewall"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Pinipigilan ang mga request na hugis-atake (injection sa database, pagbasa ng mga file ng server, pagpapatakbo ng code, script sa mga link) at mga scanner tulad ng sqlmap o Nikto. Magsimula sa “Itala lang” at lumipat sa “Harangan” makalipas ang ilang araw. Limang atake sa loob ng 10 minuto ay haharang sa address nang isang linggo; makakabasa pa rin ng site ang mga hinarangang address, pero hindi makakapagpadala. Hindi kailanman sinusuri ang mga user na nakakapag-log in sa administrator. Emergency na labasan: define('DRACO_WAF_OFF', true); sa defines.php sa ugat ng site."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Limitasyon sa bilis laban sa pangongopya"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Ang humihingi ng mas maraming pahina bawat minuto kaysa sa nababasa ng tao ay makakatanggap ng “429 Too many requests” hanggang matapos ang minuto. Hindi kailanman nililimitahan ang mga naka-log in na user, ang sarili mong mga address at ang mga search engine na beripikado sa DNS (Google, Bing, Apple, Yandex)."
PLG_SYSTEM_DRACOINSOMNIS_MODE_OFF="Patay"
PLG_SYSTEM_DRACOINSOMNIS_MODE_LOG="Itala lang: itala ang mapipigilan sana"
PLG_SYSTEM_DRACOINSOMNIS_MODE_BLOCK="Harangan"

PLG_SYSTEM_DRACOINSOMNIS_EVENTS_HELP="Iniimbak nang 90 araw. Hindi kailanman password. Ang CSV ng isang address ay may lahat ng ginawa nito, handang ilakip sa ulat ng pang-aabuso sa provider ng network nito."
PLG_SYSTEM_DRACOINSOMNIS_NO_EVENTS="Wala pa."

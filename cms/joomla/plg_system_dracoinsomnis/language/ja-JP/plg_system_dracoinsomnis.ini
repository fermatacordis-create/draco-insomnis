PLG_SYSTEM_DRACOINSOMNIS="システム - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. CAPTCHA なしで偽の登録を止め、アプリケーションファイアウォールとコピー対策の速度制限を備えます。オープンソース。"
PLG_SYSTEM_DRACOINSOMNIS_INTRO="CAPTCHA なしで偽の登録を止めます。ボットはアカウントを得られず、疑わしい試行はすべて不正利用の報告用の証拠として 90 日間保存されます。攻撃者に何かを送り返すことはありません。"
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="プラグインから見たあなたのアドレス: %1$s（接続元アドレス: %2$s）。サイトが Cloudflare などのプロキシの背後にあり、これらが実際のアドレスと異なる場合は、「訪問者のアドレス」で該当する項目を選んでください。"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="ユーザー登録を保護する"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="登録フォームに見えない罠と署名付きのページスタンプを加えます。ボットはアカウントを得られず、1 日に 3 回ボットと判定されたアドレスは 1 週間ブロックされます。"
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="ファイアウォール"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="攻撃の形をしたリクエスト（データベースへのインジェクション、サーバーファイルの読み取り、コードの実行、リンク内のスクリプト）と、sqlmap や Nikto などのスキャナーを止めます。まず「記録のみ」で始め、数日後に「ブロック」に切り替えてください。10 分間に 5 回の攻撃でそのアドレスは 1 週間ブロックされます。ブロックされたアドレスもサイトの閲覧はできますが、送信はできません。管理画面にログインできるユーザーは検査されません。非常口: サイトのルートにある defines.php に define('DRACO_WAF_OFF', true); と書きます。"
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="コピー対策の速度制限"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="人が読める以上のページを 1 分間に要求すると、その 1 分が終わるまで「429 Too many requests」が返されます。ログイン中のユーザー、あなた自身のアドレス、DNS で確認された検索エンジン（Google、Bing、Apple、Yandex）は制限されません。"

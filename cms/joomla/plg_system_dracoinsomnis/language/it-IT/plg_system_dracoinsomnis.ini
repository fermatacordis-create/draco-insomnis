PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Proxy fidati"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Solo le connessioni da questi indirizzi possono impostare l’indirizzo del visitatore tramite un’intestazione. Un indirizzo o intervallo per riga. Vuoto: questo server e le reti private. Gli intervalli di Cloudflare sono già noti."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="L’intestazione viene ignorata: questa connessione (%s) non arriva da Cloudflare né da un proxy fidato. Se il tuo proxy è su internet, aggiungi i suoi indirizzi in «Proxy fidati»."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Paesi"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="I tuoi visitatori possono arrivare da molti paesi, e un attaccante cambia paese con una VPN. Filtra solo accesso, registrazione e moduli, e inizia con «Solo registro». Amministratori, persone che lasci passare e motori di ricerca non vengono mai filtrati. Serve il firewall attivo (registro o blocco)."

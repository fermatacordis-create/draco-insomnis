PLG_SYSTEM_DRACOINSOMNIS_NETS_DESC="Un intervallo per riga (CIDR), aggiunto a quelli che il plugin già conosce. Essere in questa lista aggiunge solo punti: da sola non rende mai nessuno un bot."

PLG_SYSTEM_DRACOINSOMNIS="Sistema - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Ferma le registrazioni false senza captcha, firewall applicativo e limite di ritmo anti-copia. Open source."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Ferma le registrazioni false senza captcha: i bot non ottengono un account e ogni tentativo sospetto viene conservato 90 giorni come prova per una segnalazione di abuso. All’attaccante non viene mai rimandato nulla."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Il tuo indirizzo come lo vede il plugin: %1$s (indirizzo della connessione: %2$s). Se il sito è dietro Cloudflare o un altro proxy e non corrispondono al tuo indirizzo reale, scegli l’opzione adatta in «Indirizzo del visitatore»."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Proteggi le registrazioni"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Aggiunge una trappola invisibile e un timbro firmato della pagina al modulo di registrazione. I bot non ottengono un account; tre tentativi di bot in un giorno bloccano l’indirizzo per una settimana."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Firewall"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Ferma le richieste con la forma di un attacco (iniezione nel database, lettura di file del server, esecuzione di codice, script nei link) e gli scanner come sqlmap o Nikto. Inizia con «Solo registro» e passa a «Blocca» dopo qualche giorno. Cinque attacchi in 10 minuti bloccano l’indirizzo per una settimana; gli indirizzi bloccati possono ancora leggere il sito, ma non inviare. Gli utenti che possono accedere all’amministrazione non vengono mai ispezionati. Uscita di emergenza: define('DRACO_WAF_OFF', true); in defines.php nella radice del sito."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Limite di ritmo anti-copia"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Chi chiede più pagine al minuto di quante ne legga una persona riceve «429 Too many requests» fino alla fine del minuto. Gli utenti connessi, i tuoi indirizzi e i motori di ricerca verificati via DNS (Google, Bing, Apple, Yandex) non vengono mai limitati."
PLG_SYSTEM_DRACOINSOMNIS_MODE_OFF="Disattivato"
PLG_SYSTEM_DRACOINSOMNIS_MODE_LOG="Solo registro: annota ciò che fermerebbe"
PLG_SYSTEM_DRACOINSOMNIS_MODE_BLOCK="Blocca"

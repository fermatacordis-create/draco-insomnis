PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="Una rete /24 in IPv4 o /64 in IPv6: ciò che ottiene uno scraper che ruota tra indirizzi vicini."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_LABEL="Indirizzo del visitatore"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_DESC="Lascia «Indirizzo della connessione» a meno che il sito non sia dietro un proxy: chiunque può falsificare un’intestazione."

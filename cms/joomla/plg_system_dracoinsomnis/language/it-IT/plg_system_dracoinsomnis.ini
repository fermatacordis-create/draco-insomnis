PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="Geolocalizzazione IP di DB-IP (db-ip.com, CC BY 4.0), scaricata quando attivi il filtro e consultata sul tuo server: nessun indirizzo viene inviato altrove."
PLG_SYSTEM_DRACOINSOMNIS_GEO_DOWNLOADED="Elenco dei paesi scaricato."
PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="Non è stato possibile scaricare l’elenco dei paesi. Il filtro non fa nulla finché non c’è; salva di nuovo più tardi."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Intestazioni di sicurezza"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Nelle pagine pubbliche: niente indovinare i tipi di file, niente incorporamento in altri siti, meno dati di provenienza, niente fotocamera, microfono o posizione per i contenuti incorporati. Mai una già inviata."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Forza HTTPS per 6 mesi (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Solo se tutto il sito funziona in HTTPS e continuerà così: i browser lo ricordano e rifiutano HTTP fino alla scadenza."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Lunghezza minima della password"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="Da 8 a 64 caratteri; 0 lascia solo le regole di Utenti: Opzioni. Si applica quando si crea un account o si cambia una password."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Rifiuta le password trovate in fughe di dati"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Chiede a Have I Been Pwned con k-anonimato: dal sito escono solo 5 caratteri dello SHA-1 della password, mai la password. Se il servizio non risponde entro 3 secondi, la password viene accettata."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="La password deve avere almeno %d caratteri."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Questa password compare in fughe di dati note, quindi gli attaccanti la provano per prima. Scegline un’altra, per favore."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Blocca un indirizzo o un intervallo"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Si applica al salvataggio, poi questi campi vengono svuotati. Mai un amministratore, né il tuo indirizzo. Intervalli non più ampi di /16 (IPv4) o /32 (IPv6)."

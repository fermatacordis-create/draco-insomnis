PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="DB-IP (db-ip.com, CC BY 4.0) வழங்கும் IP புவியிருப்பிடம், வடிகட்டியை இயக்கும்போது பதிவிறக்கப்பட்டு உங்கள் சொந்தச் சேவையகத்தில் தேடப்படுகிறது: எந்த முகவரியும் எங்கும் அனுப்பப்படுவதில்லை."

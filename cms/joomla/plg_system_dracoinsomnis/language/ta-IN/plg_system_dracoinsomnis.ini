PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="நம்பகமான பதிலாள்கள்"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="இந்த முகவரிகளிலிருந்து வரும் இணைப்புகள் மட்டுமே தலைப்பு மூலம் பார்வையாளர் முகவரியை அமைக்கலாம். ஒரு வரிக்கு ஒரு முகவரி அல்லது வரம்பு. காலியாக: இந்தச் சேவையகமும் தனிப்பட்ட வலையமைப்புகளும். Cloudflare-இன் சொந்த வரம்புகள் ஏற்கெனவே தெரியும்."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="தலைப்பு புறக்கணிக்கப்படுகிறது: இந்த இணைப்பு (%s) Cloudflare-இலிருந்தோ நம்பகமான பதிலாளிடமிருந்தோ வரவில்லை. உங்கள் பதிலாள் இணையத்தில் இருந்தால், அதன் முகவரிகளை «நம்பகமான பதிலாள்கள்»-இல் சேர்க்கவும்."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="நாடுகள்"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="உங்கள் பார்வையாளர்கள் பல நாடுகளிலிருந்து வரலாம், தாக்குபவர் VPN மூலம் நாட்டை மாற்றுவார். உள்நுழைவு, பதிவு, படிவங்களை மட்டும் வடிகட்டி, «பதிவு மட்டும்» உடன் தொடங்கவும். நிர்வாகிகள், நீங்கள் அனுமதிப்பவர்கள், தேடுபொறிகள் ஒருபோதும் வடிகட்டப்படுவதில்லை. ஃபயர்வால் இயக்கத்தில் இருக்க வேண்டும் (பதிவு அல்லது தடு)."

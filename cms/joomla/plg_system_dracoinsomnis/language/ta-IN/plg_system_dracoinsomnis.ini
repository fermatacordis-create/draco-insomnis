PLG_SYSTEM_DRACOINSOMNIS_SUMMARY_IPS="அதிகச் செயலில் உள்ள முகவரிகள்:"
PLG_SYSTEM_DRACOINSOMNIS_SUMMARY_LINE="%d தாக்குதல்கள் காணப்பட்டன, %d தடுக்கப்பட்டன."
PLG_SYSTEM_DRACOINSOMNIS_SUMMARY_WHAT="என்ன:"
PLG_SYSTEM_DRACOINSOMNIS_TEST="ஃபயர்வாலைச் சோதி"
PLG_SYSTEM_DRACOINSOMNIS_TEST_BLOCKED="வேலை செய்கிறது: ஒரு தரவுத்தள ஊடுருவல் அடையாளம் காணப்பட்டுத் தடுக்கப்பட்டது (403)."
PLG_SYSTEM_DRACOINSOMNIS_TEST_HELP="தளத்திற்குத் தாக்குதல் வடிவிலான தீங்கற்ற ஒரு கோரிக்கையை அனுப்பி என்ன நடந்தது என்று சொல்லும். இது பதிவு செய்யப்படாது."
PLG_SYSTEM_DRACOINSOMNIS_TEST_LOGGED="வேலை செய்கிறது: ஒரு தரவுத்தள உட்செலுத்தல் அடையாளம் காணப்பட்டது. «பதிவு மட்டும்»-இல் அது குறிக்கப்படும், ஆனால் தடுக்கப்படாது; தயாரானதும் «தடு»-க்கு மாறவும்."
PLG_SYSTEM_DRACOINSOMNIS_TEST_NONE="சோதனைத் தாக்குதல் அடையாளம் காணப்படவில்லை. தயவுசெய்து Draco Insomnis-க்குத் தெரிவிக்கவும்."
PLG_SYSTEM_DRACOINSOMNIS_TEST_OFF="ஃபயர்வால் அணைக்கப்பட்டுள்ளது: இயக்கி, சேமித்து, மீண்டும் சோதிக்கவும்."
PLG_SYSTEM_DRACOINSOMNIS_TEST_UNREACHABLE="சோதனை சேவையகத்திலிருந்தே தளத்தை அடைய முடியவில்லை (சில ஹோஸ்டிங்குகள் இதை அனுமதிப்பதில்லை). ஃபயர்வால் இன்னும் வேலை செய்யக்கூடும்: சமீபத்திய முயற்சிகளைப் பாருங்கள்."
PLG_SYSTEM_DRACOINSOMNIS_TEST_UPSTREAM="சோதனை Joomla-வை அடையும் முன்பே ஹோஸ்டிங்கின் சொந்த ஃபயர்வாலால் நிறுத்தப்பட்டது. நல்லது: இரண்டு அடுக்குகள்."

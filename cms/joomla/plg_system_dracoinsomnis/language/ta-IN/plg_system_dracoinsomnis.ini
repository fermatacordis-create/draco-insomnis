PLG_SYSTEM_DRACOINSOMNIS_REVIEW_SENT_TEXT="நன்றி. தள உரிமையாளர் இதைப் பார்த்து, தவறாக இருந்தால் உங்களை அனுமதிப்பார்."
PLG_SYSTEM_DRACOINSOMNIS_REVIEW_SENT_TITLE="கோரிக்கை அனுப்பப்பட்டது"

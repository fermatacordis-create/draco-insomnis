PLG_SYSTEM_DRACOINSOMNIS_NO_REVIEWS="கோரிக்கைகள் இல்லை."
PLG_SYSTEM_DRACOINSOMNIS_REVIEWS="மறுபரிசீலனைக் கோரிக்கைகள்"
PLG_SYSTEM_DRACOINSOMNIS_REVIEWS_HELP="ஃபயர்வால் நிறுத்தியவர்கள் தடைப் பக்கத்திலிருந்து கேட்கலாம். தவறாக இருந்தால் சிறிது காலம் அனுமதிக்கவும். Draco அவர்களுக்கு ஒருபோதும் எழுதாது: விரும்பினால் உங்கள் சொந்த மின்னஞ்சலிலிருந்து பதிலளிக்கவும்."

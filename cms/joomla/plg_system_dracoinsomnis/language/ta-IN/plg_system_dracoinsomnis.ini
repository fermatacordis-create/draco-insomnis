PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="நாடுகளின் பட்டியலைப் பதிவிறக்க முடியவில்லை. பட்டியல் கிடைக்கும் வரை வடிகட்டி எதுவும் செய்யாது; பிறகு மீண்டும் சேமிக்கவும்."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="பாதுகாப்புத் தலைப்புகள்"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="பொதுப் பக்கங்களில்: கோப்பு வகையை ஊகித்தல் இல்லை, பிற தளங்களில் உட்பொதித்தல் இல்லை, குறைந்த பரிந்துரைத் தரவு, உட்பொதித்த உள்ளடக்கத்துக்குக் கேமரா, ஒலிவாங்கி அல்லது இருப்பிடம் இல்லை. ஏற்கெனவே அனுப்பிய தலைப்பு ஒருபோதும் மீண்டும் இல்லை."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="6 மாதங்களுக்கு HTTPS-ஐக் கட்டாயமாக்கு (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="முழுத் தளமும் HTTPS-இல் இயங்கி, தொடர்ந்து இயங்கும் என்றால் மட்டும்: உலாவிகள் இதை நினைவில் வைத்து, காலம் முடியும் வரை HTTP-ஐ மறுக்கும்."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="கடவுச்சொல்லின் குறைந்தபட்ச நீளம்"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="8 முதல் 64 எழுத்துகள்; 0 என்றால் பயனர்கள்: விருப்பங்கள் விதிகள் மட்டுமே இருக்கும். கணக்கு உருவாக்கும்போதோ கடவுச்சொல் மாற்றும்போதோ பொருந்தும்."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="தரவுக் கசிவுகளில் கண்டறியப்பட்ட கடவுச்சொற்களை நிராகரி"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="k-அநாமதேயத்துடன் Have I Been Pwned-இடம் கேட்கிறது: கடவுச்சொல்லின் SHA-1-இன் 5 எழுத்துகள் மட்டுமே தளத்தை விட்டு வெளியேறும், கடவுச்சொல் ஒருபோதும் இல்லை. சேவை 3 வினாடிகளில் பதிலளிக்காவிட்டால், கடவுச்சொல் ஏற்கப்படும்."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="கடவுச்சொல்லில் குறைந்தது %d எழுத்துகள் இருக்க வேண்டும்."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="இந்தக் கடவுச்சொல் தெரிந்த தரவுக் கசிவுகளில் உள்ளது, எனவே தாக்குபவர்கள் இதை முதலில் முயல்வார்கள். தயவுசெய்து வேறொன்றைத் தேர்ந்தெடுக்கவும்."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="ஒரு முகவரியையோ வரம்பையோ தடு"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="சேமிக்கும்போது பொருந்தும், பிறகு இந்தப் புலங்கள் காலியாகும். ஒருபோதும் நிர்வாகி இல்லை, உங்கள் சொந்த முகவரியும் இல்லை. வரம்புகள் /16 (IPv4) அல்லது /32 (IPv6)-ஐ விட அகலமாக இருக்கக் கூடாது."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_VALUE="IP அல்லது வரம்பு (உ.தா. 203.0.113.0/24)"

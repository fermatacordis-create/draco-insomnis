PLG_SYSTEM_DRACOINSOMNIS="அமைப்பு - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. கேப்ட்சா இல்லாமல் போலிப் பதிவுகளைத் தடுக்கிறது, பயன்பாட்டு ஃபயர்வால் மற்றும் நகலெடுப்பைத் தடுக்கும் வேக வரம்புடன். திறந்த மூலம்."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="கேப்ட்சா இல்லாமல் போலிப் பதிவுகளைத் தடுக்கிறது: பாட்களுக்குக் கணக்கு கிடைக்காது, சந்தேகமான ஒவ்வொரு முயற்சியும் துஷ்பிரயோகப் புகாருக்கான சான்றாக 90 நாள் வைக்கப்படும். தாக்குபவருக்கு எதுவும் திருப்பி அனுப்பப்படுவதில்லை."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="செருகுநிரல் காணும் உங்கள் முகவரி: %1$s (இணைப்பு முகவரி: %2$s). தளம் Cloudflare அல்லது வேறு பதிலாளுக்குப் பின்னால் இருந்து, இவை உங்கள் உண்மையான முகவரியிலிருந்து வேறுபட்டால், «பார்வையாளர் முகவரி»-யில் பொருந்தும் தேர்வைத் தேர்ந்தெடுக்கவும்."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="பயனர் பதிவுகளைப் பாதுகாக்கவும்"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="பதிவுப் படிவத்தில் கண்ணுக்குத் தெரியாத பொறியையும் கையொப்பமிட்ட பக்க முத்திரையையும் சேர்க்கிறது. பாட்களுக்குக் கணக்கு கிடைக்காது; ஒரே நாளில் மூன்று பாட் முயற்சிகள் அந்த முகவரியை ஒரு வாரம் தடுக்கும்."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="ஃபயர்வால்"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="தாக்குதல் வடிவிலான கோரிக்கைகளையும் (தரவுத்தள உட்செலுத்தல், சேவையகக் கோப்புகளைப் படித்தல், குறியீட்டை இயக்குதல், இணைப்புகளில் ஸ்கிரிப்ட்) sqlmap அல்லது Nikto போன்ற வருடிகளையும் தடுக்கிறது. «பதிவு மட்டும்» உடன் தொடங்கி சில நாட்களுக்குப் பிறகு «தடு»-க்கு மாறவும். 10 நிமிடங்களில் ஐந்து தாக்குதல்கள் முகவரியை ஒரு வாரம் தடுக்கும்; தடுக்கப்பட்ட முகவரிகள் தளத்தைப் படிக்கலாம், ஆனால் எதையும் அனுப்ப முடியாது. நிர்வாகத்தில் உள்நுழையக்கூடிய பயனர்கள் ஒருபோதும் சோதிக்கப்படுவதில்லை. அவசர வழி: தளத்தின் வேரில் உள்ள defines.php-இல் define('DRACO_WAF_OFF', true); எழுதவும்."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="நகலெடுப்பைத் தடுக்கும் வேக வரம்பு"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="ஒரு மனிதர் படிப்பதைவிட நிமிடத்துக்கு அதிகப் பக்கங்களைக் கேட்பவருக்கு, அந்த நிமிடம் முடியும் வரை «429 Too many requests» கிடைக்கும். உள்நுழைந்த பயனர்கள், உங்கள் சொந்த முகவரிகள், DNS மூலம் சரிபார்க்கப்பட்ட தேடுபொறிகள் (Google, Bing, Apple, Yandex) ஒருபோதும் வரம்பிடப்படுவதில்லை."

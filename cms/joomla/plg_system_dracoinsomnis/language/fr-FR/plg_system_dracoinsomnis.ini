PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Proxys de confiance"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Seules les connexions venant de ces adresses peuvent fixer l’adresse du visiteur par un en-tête. Une adresse ou une plage par ligne. Vide : ce serveur et les réseaux privés. Les plages de Cloudflare sont déjà connues."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="L’en-tête est ignoré : cette connexion (%s) ne vient ni de Cloudflare ni d’un proxy de confiance. Si votre proxy est sur Internet, ajoutez ses adresses dans « Proxys de confiance »."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Pays"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Vos visiteurs peuvent venir de nombreux pays, et un attaquant change de pays avec un VPN. Filtrez seulement la connexion, l’inscription et les formulaires, et commencez par « Journal seulement ». Les administrateurs, les personnes que vous laissez passer et les moteurs de recherche ne sont jamais filtrés. Le pare-feu doit être actif (journal ou blocage)."

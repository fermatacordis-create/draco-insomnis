PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="Un réseau /24 en IPv4 ou /64 en IPv6 : ce qu’obtient un aspirateur de site qui change d’adresses voisines."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_LABEL="Adresse du visiteur"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_DESC="Laissez « Adresse de connexion » sauf si le site est derrière un proxy : n’importe qui peut falsifier un en-tête."

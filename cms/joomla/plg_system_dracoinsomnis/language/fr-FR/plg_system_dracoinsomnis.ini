PLG_SYSTEM_DRACOINSOMNIS_NETS_DESC="Une plage par ligne (CIDR), ajoutée à celles que l’extension connaît déjà. Figurer sur cette liste ajoute seulement des points : à elle seule, elle ne fait jamais de quelqu’un un robot."
PLG_SYSTEM_DRACOINSOMNIS_AUTO_BLOCK="Automatique : %d tentatives de bot en 24 h"

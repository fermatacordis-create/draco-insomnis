PLG_SYSTEM_DRACOINSOMNIS="Système - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Arrête les fausses inscriptions sans captcha, pare-feu applicatif et limite de rythme anti-copie. Libre."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Arrête les fausses inscriptions sans captcha : les robots n’obtiennent pas de compte, et chaque tentative suspecte est gardée 90 jours comme preuve pour un signalement d’abus. Rien n’est jamais renvoyé à l’attaquant."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Votre adresse telle que l’extension la voit : %1$s (adresse de connexion : %2$s). Si le site est derrière Cloudflare ou un autre proxy et qu’elles diffèrent de votre adresse réelle, choisissez l’option correspondante dans « Adresse du visiteur »."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Protéger les inscriptions"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Ajoute un piège invisible et un tampon de page signé au formulaire d’inscription. Les robots n’obtiennent pas de compte ; trois tentatives de robot en un jour bloquent l’adresse pendant une semaine."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Pare-feu"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Arrête les requêtes qui ont la forme d’une attaque (injection dans la base de données, lecture de fichiers du serveur, exécution de code, scripts dans les liens) et les scanners comme sqlmap ou Nikto. Commencez par « Journal seulement » et passez à « Bloquer » après quelques jours. Cinq attaques en 10 minutes bloquent l’adresse pendant une semaine ; les adresses bloquées peuvent toujours lire le site, mais pas envoyer. Les utilisateurs qui peuvent se connecter à l’administration ne sont jamais inspectés. Sortie de secours : define('DRACO_WAF_OFF', true); dans defines.php à la racine du site."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Limite de rythme anti-copie"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Plus de pages par minute qu’une personne n’en lit reçoivent « 429 Trop de requêtes » jusqu’à la fin de la minute. Les utilisateurs connectés, vos propres adresses et les moteurs de recherche vérifiés par DNS (Google, Bing, Apple, Yandex) ne sont jamais limités."
PLG_SYSTEM_DRACOINSOMNIS_MODE_OFF="Désactivé"
PLG_SYSTEM_DRACOINSOMNIS_MODE_LOG="Journal seulement : noter ce qui serait arrêté"
PLG_SYSTEM_DRACOINSOMNIS_MODE_BLOCK="Bloquer"

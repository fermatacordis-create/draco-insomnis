PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="Géolocalisation IP par DB-IP (db-ip.com, CC BY 4.0), téléchargée quand vous activez le filtre et consultée sur votre propre serveur : aucune adresse n’est envoyée nulle part."
PLG_SYSTEM_DRACOINSOMNIS_GEO_DOWNLOADED="Liste des pays téléchargée."
PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="La liste des pays n’a pas pu être téléchargée. Le filtre ne fait rien tant qu’elle n’est pas là ; enregistrez de nouveau plus tard."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="En-têtes de sécurité"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Sur les pages publiques : pas de devinette du type de fichier, pas d’affichage dans d’autres sites, moins de données de provenance, ni caméra, ni micro, ni position pour le contenu intégré. Jamais un en-tête déjà envoyé."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Forcer HTTPS pendant 6 mois (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Seulement si tout le site fonctionne en HTTPS et le restera : les navigateurs s’en souviennent et refusent HTTP jusqu’à expiration."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Longueur minimale du mot de passe"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="De 8 à 64 caractères ; 0 laisse seulement les règles de Utilisateurs : Options. Appliqué à la création d’un compte ou au changement d’un mot de passe."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Refuser les mots de passe trouvés dans des fuites de données"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Interroge Have I Been Pwned avec k-anonymat : seuls 5 caractères du SHA-1 du mot de passe quittent le site, jamais le mot de passe. Si le service ne répond pas en 3 secondes, le mot de passe est accepté."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="Le mot de passe doit comporter au moins %d caractères."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Ce mot de passe figure dans des fuites de données connues, les attaquants l’essaient donc en premier. Choisissez-en un autre, s’il vous plaît."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Bloquer une adresse ou une plage"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Appliqué à l’enregistrement, puis ces champs sont vidés. Jamais un administrateur, ni votre propre adresse. Plages pas plus larges que /16 (IPv4) ou /32 (IPv6)."

PLG_SYSTEM_DRACOINSOMNIS="Система - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Останавливает фальшивые регистрации без капчи, брандмауэр приложений и ограничение темпа против копирования. Открытый код."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Останавливает фальшивые регистрации без капчи: боты не получают учётную запись, а каждая подозрительная попытка хранится 90 дней как доказательство для жалобы о злоупотреблении. Атакующему ничего не отправляется в ответ."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Ваш адрес, как его видит плагин: %1$s (адрес соединения: %2$s). Если сайт находится за Cloudflare или другим прокси и они отличаются от вашего настоящего адреса, выберите подходящий вариант в «Адрес посетителя»."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Защитить регистрацию пользователей"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Добавляет в форму регистрации невидимую ловушку и подписанную метку страницы. Боты не получают учётную запись; три попытки бота за день блокируют адрес на неделю."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Брандмауэр"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Останавливает запросы, похожие на атаку (внедрение в базу данных, чтение файлов сервера, выполнение кода, скрипты в ссылках), и сканеры вроде sqlmap или Nikto. Начните с «Только записывать» и через несколько дней переключитесь на «Заблокировать». Пять атак за 10 минут блокируют адрес на неделю; заблокированные адреса по-прежнему могут читать сайт, но не отправлять данные. Пользователи, которые могут войти в панель администратора, никогда не проверяются. Аварийный выход: define('DRACO_WAF_OFF', true); в defines.php в корне сайта."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Ограничение темпа против копирования"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Кто запрашивает больше страниц в минуту, чем читает человек, получает «429 Too many requests» до конца минуты. Вошедшие пользователи, ваши собственные адреса и поисковики, проверенные по DNS (Google, Bing, Apple, Yandex), никогда не ограничиваются."

PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Заголовки безопасности"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="На публичных страницах: без угадывания типов файлов, без встраивания на чужие сайты, меньше данных об источнике, без камеры, микрофона и геолокации для встроенного содержимого. Никогда заголовок, который уже отправлен."

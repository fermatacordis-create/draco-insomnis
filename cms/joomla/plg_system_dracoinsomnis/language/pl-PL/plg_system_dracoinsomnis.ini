PLG_SYSTEM_DRACOINSOMNIS_NETS_DESC="Jeden zakres w wierszu (CIDR), dodawany do tych, które wtyczka już zna. Obecność na tej liście tylko dodaje punkty: sama w sobie nigdy nie robi z nikogo bota."

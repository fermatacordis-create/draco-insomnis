PLG_SYSTEM_DRACOINSOMNIS="System - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Zatrzymuje fałszywe rejestracje bez captchy, zapora aplikacji i limit tempa przeciw kopiowaniu. Otwarte źródło."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Zatrzymuje fałszywe rejestracje bez captchy: boty nie dostają konta, a każda podejrzana próba jest przechowywana 90 dni jako dowód do zgłoszenia nadużycia. Atakującemu nigdy nic nie jest odsyłane."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Twój adres tak, jak widzi go wtyczka: %1$s (adres połączenia: %2$s). Jeśli witryna stoi za Cloudflare lub innym proxy i różnią się one od Twojego prawdziwego adresu, wybierz odpowiednią opcję w „Adres odwiedzającego”."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Chroń rejestrację użytkowników"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Dodaje do formularza rejestracji niewidoczną pułapkę i podpisany znacznik strony. Boty nie dostają konta; trzy próby bota w ciągu dnia blokują adres na tydzień."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Zapora"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Zatrzymuje żądania wyglądające na atak (wstrzyknięcie do bazy danych, odczyt plików serwera, uruchamianie kodu, skrypty w linkach) oraz skanery takie jak sqlmap czy Nikto. Zacznij od „Tylko zapisuj”, a po kilku dniach przejdź na „Zablokuj”. Pięć ataków w 10 minut blokuje adres na tydzień; zablokowane adresy nadal mogą czytać witrynę, ale nie mogą niczego wysyłać. Użytkownicy, którzy mogą zalogować się do administracji, nigdy nie są sprawdzani. Wyjście awaryjne: define('DRACO_WAF_OFF', true); w pliku defines.php w katalogu głównym witryny."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Limit tempa przeciw kopiowaniu"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Kto pobiera więcej stron na minutę, niż czyta człowiek, dostaje „429 Too many requests” do końca minuty. Zalogowani użytkownicy, Twoje własne adresy i wyszukiwarki zweryfikowane przez DNS (Google, Bing, Apple, Yandex) nigdy nie są ograniczani."
PLG_SYSTEM_DRACOINSOMNIS_MODE_OFF="Wyłączone"
PLG_SYSTEM_DRACOINSOMNIS_MODE_LOG="Tylko zapisuj: notuj, co zostałoby zatrzymane"

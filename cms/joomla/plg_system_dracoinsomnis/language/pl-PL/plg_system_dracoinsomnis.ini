PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Zaufane serwery proxy"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Tylko połączenia z tych adresów mogą ustawiać adres odwiedzającego przez nagłówek. Jeden adres lub zakres w wierszu. Puste: ten serwer i sieci prywatne. Zakresy samego Cloudflare są już znane."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="Nagłówek jest ignorowany: to połączenie (%s) nie pochodzi z Cloudflare ani z zaufanego proxy. Jeśli Twoje proxy jest w internecie, dodaj jego adresy w „Zaufane serwery proxy”."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Kraje"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Twoi odwiedzający mogą pochodzić z wielu krajów, a atakujący zmienia kraj przez VPN. Filtruj tylko logowanie, rejestrację i formularze, i zacznij od „Tylko zapisuj”. Administratorzy, osoby, które przepuszczasz, i wyszukiwarki nigdy nie są filtrowani. Wymaga włączonej zapory (zapis lub blokada)."

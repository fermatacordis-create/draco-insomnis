PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="Geolokalizacja IP od DB-IP (db-ip.com, CC BY 4.0), pobierana po włączeniu filtra i sprawdzana na Twoim własnym serwerze: żaden adres nie jest nigdzie wysyłany."
PLG_SYSTEM_DRACOINSOMNIS_GEO_DOWNLOADED="Lista krajów pobrana."
PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="Nie udało się pobrać listy krajów. Filtr nic nie robi, dopóki jej nie ma; zapisz ponownie później."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Nagłówki bezpieczeństwa"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Na stronach publicznych: bez zgadywania typów plików, bez osadzania w obcych witrynach, mniej danych o pochodzeniu, bez kamery, mikrofonu i lokalizacji dla osadzonych treści. Nigdy nagłówek, który już jest wysyłany."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Wymuszaj HTTPS przez 6 miesięcy (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Tylko jeśli cała witryna działa na HTTPS i tak zostanie: przeglądarki to pamiętają i odrzucają HTTP aż do wygaśnięcia."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Minimalna długość hasła"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="Od 8 do 64 znaków; 0 zostawia tylko reguły z Użytkownicy: Opcje. Stosowane przy tworzeniu konta lub zmianie hasła."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Odrzucaj hasła znalezione w wyciekach danych"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Pyta Have I Been Pwned z k-anonimowością: witrynę opuszcza tylko 5 znaków SHA-1 hasła, nigdy samo hasło. Jeśli usługa nie odpowie w 3 sekundy, hasło jest akceptowane."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="Hasło musi mieć co najmniej %d znaków."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="To hasło występuje w znanych wyciekach danych, więc atakujący próbują go najpierw. Wybierz, proszę, inne."

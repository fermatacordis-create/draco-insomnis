PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_LABEL="Stron na minutę, na sieć"
PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="Sieć /24 dla IPv4 lub /64 dla IPv6: tyle dostaje scraper, który przeskakuje między sąsiednimi adresami."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_LABEL="Adres odwiedzającego"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_DESC="Zostaw „Adres połączenia”, chyba że witryna stoi za proxy: nagłówek może podrobić każdy."

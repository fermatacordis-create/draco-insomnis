PLG_SYSTEM_DRACOINSOMNIS="Sistema - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Barra cadastros falsos sem captchas, firewall de aplicação e limite de ritmo anticópia. Código aberto."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Barra cadastros falsos sem captchas: os robôs não ganham conta, e cada tentativa suspeita fica guardada 90 dias como prova para uma denúncia de abuso. Nada é enviado de volta ao atacante."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Seu endereço como o plugin o vê: %1$s (endereço da conexão: %2$s). Se o site estiver atrás do Cloudflare ou de outro proxy e eles forem diferentes do seu endereço real, escolha a opção correspondente em “Endereço do visitante”."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Proteger os cadastros"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Adiciona uma armadilha invisível e um selo assinado da página ao formulário de cadastro. Os robôs não ganham conta; três tentativas de robô em um dia bloqueiam o endereço por uma semana."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Firewall"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Barra requisições com cara de ataque (injeção no banco de dados, leitura de arquivos do servidor, execução de código, scripts em links) e scanners como sqlmap ou Nikto. Comece com “Só registrar” e passe para “Bloquear” depois de alguns dias. Cinco ataques em 10 minutos bloqueiam o endereço por uma semana; endereços bloqueados ainda podem ler o site, mas não enviar. Usuários que podem entrar na administração nunca são inspecionados. Saída de emergência: define('DRACO_WAF_OFF', true); em defines.php na raiz do site."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Limite de ritmo anticópia"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Quem pede mais páginas por minuto do que uma pessoa lê recebe “429 Too many requests” até o minuto acabar. Usuários logados, seus próprios endereços e buscadores verificados por DNS (Google, Bing, Apple, Yandex) nunca são limitados."
PLG_SYSTEM_DRACOINSOMNIS_MODE_OFF="Desligado"
PLG_SYSTEM_DRACOINSOMNIS_MODE_LOG="Só registrar: anotar o que barraria"
PLG_SYSTEM_DRACOINSOMNIS_MODE_BLOCK="Bloquear"

PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="Uma rede /24 no IPv4 ou /64 no IPv6: o que um copiador consegue ao trocar por endereços vizinhos."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_LABEL="Endereço do visitante"
PLG_SYSTEM_DRACOINSOMNIS_PROXY_DESC="Deixe “Endereço da conexão” a menos que o site esteja atrás de um proxy: qualquer um pode forjar um cabeçalho."

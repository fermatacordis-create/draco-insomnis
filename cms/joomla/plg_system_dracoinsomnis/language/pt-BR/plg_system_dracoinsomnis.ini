PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Proxies confiáveis"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Só conexões vindas destes endereços podem definir o endereço do visitante por um cabeçalho. Um endereço ou faixa por linha. Vazio: este servidor e as redes privadas. As faixas do próprio Cloudflare já são conhecidas."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="O cabeçalho é ignorado: esta conexão (%s) não vem do Cloudflare nem de um proxy confiável. Se o seu proxy está na internet, adicione os endereços dele em “Proxies confiáveis”."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Países"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Seus visitantes podem vir de muitos países, e um atacante troca de país com uma VPN. Filtre só login, cadastro e formulários, e comece com “Só registrar”. Administradores, pessoas que você liberou e buscadores nunca são filtrados. Precisa do firewall ligado (registrar ou bloquear)."

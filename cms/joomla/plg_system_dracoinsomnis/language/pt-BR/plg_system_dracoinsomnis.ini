PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Cabeçalhos de segurança"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Nas páginas públicas: sem adivinhar tipos de arquivo, sem exibição dentro de outros sites, menos dados de origem, sem câmera, microfone ou localização para conteúdo incorporado. Nunca um já enviado."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Forçar HTTPS por 6 meses (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Só se o site inteiro funcionar em HTTPS e continuar assim: os navegadores guardam isso e recusam HTTP até expirar."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Tamanho mínimo da senha"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="De 8 a 64 caracteres; 0 deixa só as regras de Usuários: Opções. Vale ao criar uma conta ou trocar uma senha."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Recusar senhas encontradas em vazamentos de dados"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Pergunta ao Have I Been Pwned com k-anonimato: só 5 caracteres do SHA-1 da senha saem do site, nunca a senha. Se o serviço não responder em 3 segundos, a senha é aceita."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="A senha precisa ter pelo menos %d caracteres."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Esta senha aparece em vazamentos de dados conhecidos, então os atacantes a testam primeiro. Escolha outra, por favor."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Bloquear um endereço ou faixa"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Aplicado ao salvar; depois estes campos são esvaziados. Nunca um administrador, nem o seu próprio endereço. Faixas não maiores que /16 (IPv4) ou /32 (IPv6)."

PLG_SYSTEM_DRACOINSOMNIS_GEO_FAILED="Senarai negara tidak dapat dimuat turun. Penapis tidak melakukan apa-apa sehingga senarai itu ada; simpan semula kemudian."
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_LABEL="Pengepala keselamatan"
PLG_SYSTEM_DRACOINSOMNIS_HEADERS_DESC="Pada halaman awam: tiada tekaan jenis fail, tiada pembingkaian oleh laman lain, kurang data rujukan, tiada kamera, mikrofon atau lokasi untuk kandungan terbenam. Tidak pernah pengepala yang sudah dihantar."
PLG_SYSTEM_DRACOINSOMNIS_HSTS_LABEL="Paksa HTTPS selama 6 bulan (HSTS)"
PLG_SYSTEM_DRACOINSOMNIS_HSTS_DESC="Hanya jika seluruh laman berfungsi dengan HTTPS dan akan terus begitu: pelayar mengingatinya dan menolak HTTP sehingga tamat tempoh."
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_LABEL="Panjang minimum kata laluan"
PLG_SYSTEM_DRACOINSOMNIS_PWD_MIN_DESC="Dari 8 hingga 64 aksara; 0 hanya mengekalkan peraturan Pengguna: Pilihan. Digunakan apabila akaun dicipta atau kata laluan ditukar."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_LABEL="Tolak kata laluan yang ditemui dalam kebocoran data"
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED_DESC="Bertanya kepada Have I Been Pwned dengan k-anonimiti: hanya 5 aksara SHA-1 kata laluan keluar dari laman, tidak pernah kata laluan itu. Jika perkhidmatan tidak menjawab dalam 3 saat, kata laluan diterima."
PLG_SYSTEM_DRACOINSOMNIS_PWD_SHORT="Kata laluan mesti mempunyai sekurang-kurangnya %d aksara."
PLG_SYSTEM_DRACOINSOMNIS_PWD_BREACHED="Kata laluan ini muncul dalam kebocoran data yang diketahui, jadi penyerang mencubanya dahulu. Sila pilih yang lain."
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_LABEL="Sekat alamat atau julat"
PLG_SYSTEM_DRACOINSOMNIS_BLOCK_DESC="Digunakan apabila anda menyimpan, kemudian medan ini dikosongkan. Tidak pernah pentadbir, dan bukan alamat anda sendiri. Julat tidak lebih luas daripada /16 (IPv4) atau /32 (IPv6)."

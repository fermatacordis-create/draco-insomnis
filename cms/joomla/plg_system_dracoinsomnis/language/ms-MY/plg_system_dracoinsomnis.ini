PLG_SYSTEM_DRACOINSOMNIS="Sistem - Draco Insomnis"
PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. Menghalang pendaftaran palsu tanpa captcha, tembok api aplikasi dan had kadar anti-salin. Sumber terbuka."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="Menghalang pendaftaran palsu tanpa captcha: bot tidak mendapat akaun, dan setiap cubaan yang mencurigakan disimpan 90 hari sebagai bukti untuk laporan penyalahgunaan. Tiada apa-apa yang dihantar balik kepada penyerang."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="Alamat anda seperti yang dilihat oleh plugin: %1$s (alamat sambungan: %2$s). Jika laman berada di belakang Cloudflare atau proksi lain dan alamat ini berbeza daripada alamat sebenar anda, pilih pilihan yang sepadan dalam “Alamat pelawat”."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="Lindungi pendaftaran pengguna"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="Menambah perangkap tidak kelihatan dan cap halaman bertandatangan pada borang pendaftaran. Bot tidak mendapat akaun; tiga cubaan bot dalam sehari menyekat alamat itu selama seminggu."
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="Tembok api"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="Menghalang permintaan berbentuk serangan (suntikan pangkalan data, membaca fail pelayan, menjalankan kod, skrip dalam pautan) dan pengimbas seperti sqlmap atau Nikto. Mulakan dengan “Log sahaja” dan tukar kepada “Sekat” selepas beberapa hari. Lima serangan dalam 10 minit menyekat alamat selama seminggu; alamat yang disekat masih boleh membaca laman, tetapi tidak boleh menghantar. Pengguna yang boleh log masuk ke pentadbir tidak pernah diperiksa. Jalan keluar kecemasan: define('DRACO_WAF_OFF', true); dalam defines.php di akar laman."
PLG_SYSTEM_DRACOINSOMNIS_PACE_LABEL="Had kadar anti-salin"
PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="Sesiapa yang meminta lebih banyak halaman seminit daripada yang dibaca manusia mendapat “429 Too many requests” sehingga minit itu tamat. Pengguna yang log masuk, alamat anda sendiri dan enjin carian yang disahkan melalui DNS (Google, Bing, Apple, Yandex) tidak pernah dihadkan."

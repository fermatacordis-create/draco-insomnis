PLG_SYSTEM_DRACOINSOMNIS_RATE_NET_DESC="Rangkaian /24 untuk IPv4 atau /64 untuk IPv6: apa yang diperoleh pengikis apabila bertukar-tukar alamat yang bersebelahan."

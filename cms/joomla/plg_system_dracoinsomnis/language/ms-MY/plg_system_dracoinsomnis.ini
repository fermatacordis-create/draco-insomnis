PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_LABEL="Proksi dipercayai"
PLG_SYSTEM_DRACOINSOMNIS_TRUSTED_DESC="Hanya sambungan daripada alamat ini boleh menetapkan alamat pelawat melalui pengepala. Satu alamat atau julat setiap baris. Kosong: pelayan ini dan rangkaian peribadi. Julat milik Cloudflare sudah diketahui."
PLG_SYSTEM_DRACOINSOMNIS_PROXY_IGNORED="Pengepala diabaikan: sambungan ini (%s) bukan daripada Cloudflare atau proksi dipercayai. Jika proksi anda berada di internet, tambah alamatnya dalam “Proksi dipercayai”."
PLG_SYSTEM_DRACOINSOMNIS_GEO_LABEL="Negara"
PLG_SYSTEM_DRACOINSOMNIS_GEO_DESC="Pelawat anda mungkin datang dari banyak negara, dan penyerang menukar negara dengan VPN. Tapis hanya log masuk, pendaftaran dan borang, dan mulakan dengan “Log sahaja”. Pentadbir, orang yang anda benarkan lalu dan enjin carian tidak pernah ditapis. Perlu tembok api dihidupkan (log atau sekat)."

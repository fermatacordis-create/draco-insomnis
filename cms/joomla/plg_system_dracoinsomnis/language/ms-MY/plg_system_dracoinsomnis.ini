PLG_SYSTEM_DRACOINSOMNIS_NETS_DESC="Satu julat setiap baris (CIDR), ditambah kepada julat yang sudah diketahui plugin. Berada dalam senarai ini hanya menambah mata: dengan sendirinya ia tidak pernah menjadikan sesiapa bot."

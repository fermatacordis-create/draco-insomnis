PLG_SYSTEM_DRACOINSOMNIS_GEO_CREDIT="Geolokasi IP oleh DB-IP (db-ip.com, CC BY 4.0), dimuat turun apabila anda menghidupkan penapis dan dicari di pelayan anda sendiri: tiada alamat dihantar ke mana-mana."

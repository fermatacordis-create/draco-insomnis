PLG_SYSTEM_DRACOINSOMNIS_PACE_DESC="每分钟请求的页面数超过一个人能阅读的数量时，会收到“429 Too many requests”，直到这一分钟结束。已登录用户、你自己的地址以及经 DNS 验证的搜索引擎（Google、Bing、Apple、Yandex）永远不受限制。"

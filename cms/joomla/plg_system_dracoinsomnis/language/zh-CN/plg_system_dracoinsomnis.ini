PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. 无需验证码即可阻止虚假注册，提供应用防火墙和防复制速率限制。开源。"
PLG_SYSTEM_DRACOINSOMNIS_INTRO="无需验证码即可阻止虚假注册：机器人拿不到账户，每次可疑尝试都会保存 90 天，作为滥用举报的证据。绝不会向攻击者回发任何内容。"
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="插件看到的你的地址：%1$s（连接地址：%2$s）。如果网站位于 Cloudflare 或其他代理之后，且它们与你的真实地址不同，请在“访客地址”中选择相应选项。"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="保护用户注册"
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_DESC="在注册表单中加入一个隐形陷阱和一个签名的页面戳。机器人拿不到账户；一天内三次机器人尝试会把该地址封锁一周。"
PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="防火墙"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="阻止具有攻击特征的请求（数据库注入、读取服务器文件、执行代码、链接中的脚本）以及 sqlmap、Nikto 等扫描器。先用“仅记录”，几天后再改为“封锁”。10 分钟内五次攻击会把该地址封锁一周；被封锁的地址仍可浏览网站，但不能提交。能登录管理后台的用户永远不会被检查。紧急出口：在网站根目录的 defines.php 中写入 define('DRACO_WAF_OFF', true);。"

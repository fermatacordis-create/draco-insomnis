PLG_SYSTEM_DRACOINSOMNIS_WAF_LABEL="방화벽"
PLG_SYSTEM_DRACOINSOMNIS_WAF_DESC="공격 형태의 요청(데이터베이스 삽입, 서버 파일 읽기, 코드 실행, 링크 속 스크립트)과 sqlmap, Nikto 같은 스캐너를 막습니다. ‘기록만’으로 시작하고 며칠 뒤 ‘차단’으로 바꾸세요. 10분에 공격 5번이면 그 주소는 일주일 동안 차단되며, 차단된 주소도 사이트를 읽을 수는 있지만 전송은 할 수 없습니다. 관리자 화면에 로그인할 수 있는 사용자는 검사하지 않습니다. 비상구: 사이트 루트의 defines.php에 define('DRACO_WAF_OFF', true); 를 넣으세요."

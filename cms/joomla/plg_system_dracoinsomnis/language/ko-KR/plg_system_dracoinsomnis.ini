PLG_SYSTEM_DRACOINSOMNIS_XML_DESCRIPTION="Ab insomni custodita dracone. 캡차 없이 가짜 가입을 막고, 애플리케이션 방화벽과 복제 방지 속도 제한을 제공합니다. 오픈 소스."
PLG_SYSTEM_DRACOINSOMNIS_INTRO="캡차 없이 가짜 가입을 막습니다. 봇은 계정을 얻지 못하고, 의심스러운 시도는 모두 악용 신고를 위한 증거로 90일간 보관됩니다. 공격자에게는 아무것도 돌려보내지 않습니다."
PLG_SYSTEM_DRACOINSOMNIS_YOUR_IP="플러그인이 보는 내 주소: %1$s (연결 주소: %2$s). 사이트가 Cloudflare나 다른 프록시 뒤에 있고 이 주소가 실제 주소와 다르면 ‘방문자 주소’에서 알맞은 항목을 고르세요."
PLG_SYSTEM_DRACOINSOMNIS_SHIELD_LABEL="회원 가입 보호"

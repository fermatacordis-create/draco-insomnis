name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  wordpress:
    name: WordPress ${{ matrix.wp }} — integration, HTTP and Plugin Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: ['latest', '6.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1:3306
      DB_NAME: wordpress_test
      DB_USER: root
      DB_PASS: root
      WP_DIR: /tmp/wordpress
      WP_URL: http://127.0.0.1:8080
      WP_VERSION: ${{ matrix.wp }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, gd
          tools: wp-cli
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Install WordPress with the plugin ZIP
        run: bin/ci-wp-setup.sh
      - name: Integration tests
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist
      - name: HTTP tests
        run: |
          php -S 127.0.0.1:8080 -t "$WP_DIR" tests/ci/router.php > /tmp/php-server.log 2>&1 &
          sleep 2
          bin/ci-http-smoke.sh
      - name: WordPress.org Plugin Check
        if: matrix.wp == 'latest'
        run: |
          wp --path="$WP_DIR" plugin install plugin-check --activate
          wp --path="$WP_DIR" plugin check draco-insomnis --format=csv --fields=line,column,type,code,message,file | tee /tmp/plugin-check.csv
          if grep -qE ',(ERROR|WARNING),' /tmp/plugin-check.csv; then echo "Plugin Check found problems"; exit 1; fi
      - name: PHP notices from the run
        if: always()
        run: |
          if [ -s "$WP_DIR/wp-content/debug.log" ]; then
            cat "$WP_DIR/wp-content/debug.log"
            if grep -i 'draco' "$WP_DIR/wp-content/debug.log"; then echo "Draco caused PHP notices"; exit 1; fi
          fi

  drupal:
    name: Drupal ${{ matrix.drupal }} — end to end
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drupal: ['^11', '~10.3.0']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drupal
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DR_DIR: /tmp/drupal
      BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd, zip
          coverage: none
      - name: Install Drupal with the module ZIP
        run: |
          composer create-project "drupal/recommended-project:${{ matrix.drupal }}" "$DR_DIR" --no-interaction --no-progress
          composer -d "$DR_DIR" require drush/drush --no-interaction --no-progress
          zip=$(bin/build-drupal.sh /tmp/dist)
          mkdir -p "$DR_DIR/web/modules/contrib" && unzip -q "$zip" -d "$DR_DIR/web/modules/contrib"
          cd "$DR_DIR"
          vendor/bin/drush site:install standard --db-url=mysql://root:root@127.0.0.1:3306/drupal --account-pass=admin-ci --site-name=Draco -y
          vendor/bin/drush en draco_insomnis -y
      - name: End-to-end tests
        run: |
          (cd "$DR_DIR/web" && PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8080 .ht.router.php > /tmp/php-server.log 2>&1 &)
          cd "$DR_DIR"
          vendor/bin/drush cr
          sleep 2
          DRUSH=vendor/bin/drush "$GITHUB_WORKSPACE/tests/e2e/drupal.sh"
      - name: PHP errors from the run
        if: always()
        run: |
          cd "$DR_DIR" && vendor/bin/drush watchdog:show --severity=Error --count=2 --extended 2>/dev/null | head -80 || true
          grep -iE 'fatal|draco' /tmp/php-server.log | head -20 || true

  joomla:
    name: Joomla ${{ matrix.joomla }} — end to end
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        joomla: ['5', '6']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: joomla
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JL_DIR: /tmp/joomla
      BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, zip, intl
          coverage: none
      - name: Install the latest Joomla ${{ matrix.joomla }} and the plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api 'repos/joomla/joomla-cms/releases?per_page=30' -q '[.[] | select(.prerelease == false) | select(.tag_name | startswith("${{ matrix.joomla }}.")) | .assets[] | select(.name | test("Stable-Full_Package.zip$")) | .browser_download_url][0]')
          echo "Joomla: $url"
          mkdir -p "$JL_DIR" && curl -sSfL "$url" -o /tmp/joomla.zip && unzip -q /tmp/joomla.zip -d "$JL_DIR"
          cd "$JL_DIR"
          php installation/joomla.php install --site-name=Draco --admin-user="Draco Admin" --admin-username=admin --admin-password='Draco-CI-2026-admin' --admin-email=admin@example.org \
            --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass=root --db-name=joomla --db-prefix=jl_ --db-encryption=0
          rm -rf installation
          zip=$("$GITHUB_WORKSPACE/bin/build-joomla.sh" /tmp/dist)
          php cli/joomla.php extension:install --path="$zip"
          mysql -h127.0.0.1 -uroot -proot joomla -e "UPDATE jl_extensions SET enabled=1 WHERE type='plugin' AND element='dracoinsomnis'"
      - name: End-to-end tests
        run: |
          cd "$JL_DIR"
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          sleep 2
          "$GITHUB_WORKSPACE/tests/e2e/joomla.sh"
      - name: PHP errors from the run
        if: always()
        run: grep -iE 'fatal|draco' /tmp/php-server.log | head -20 || true

  prestashop:
    name: PrestaShop ${{ matrix.ps }} — end to end
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ps: '8'
            folders: -e PS_FOLDER_ADMIN=admin-ci -e PS_FOLDER_INSTALL=install-ci
            auto: '1'
          # The 9 image's automatic install fails at its very end (it removes install/, which the 9 installer
          # already removed): run the same installer by hand instead.
          - ps: '9'
            folders: -e PS_FOLDER_ADMIN=admin
            auto: '0'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prestashop
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      BASE: http://127.0.0.1
      MYSQL: mysql -h127.0.0.1 -uroot -proot prestashop
      DOCKER_SHOP: ps
    steps:
      - uses: actions/checkout@v4
      - name: Install PrestaShop ${{ matrix.ps }} (official image) and the module ZIP
        run: |
          docker run -d --name ps --network host \
            -e DB_SERVER=127.0.0.1 -e DB_USER=root -e DB_PASSWD=root -e DB_NAME=prestashop -e DB_PREFIX=ps_ \
            -e PS_INSTALL_AUTO=${{ matrix.auto }} -e PS_DOMAIN=127.0.0.1 -e PS_LANGUAGE=en -e PS_COUNTRY=ES \
            ${{ matrix.folders }} -e ADMIN_MAIL=admin@example.org -e ADMIN_PASSWD=Draco-CI-2026-admin \
            prestashop/prestashop:${{ matrix.ps }}
          if [ "${{ matrix.auto }}" = 0 ]; then
            for i in $(seq 1 60); do docker exec ps test -f /var/www/html/install/index_cli.php && break; sleep 3; done
            # The installer ends by renaming admin/ to a random name and sometimes cannot (the image is still
            # setting the folder up): that is the only error let through, the tests never use the back office.
            set +e
            out=$(docker exec -u www-data ps php -d memory_limit=-1 /var/www/html/install/index_cli.php --domain=127.0.0.1 \
              --db_server=127.0.0.1:3306 --db_name=prestashop --db_user=root --db_password=root --prefix=ps_ \
              --firstname=Draco --lastname=CI --password=Draco-CI-2026-admin --email=admin@example.org \
              --language=en --country=es --all_languages=0 --newsletter=0 --send_email=0 --ssl=0 2>&1)
            rc=$?
            set -e
            echo "$out"
            if [ "$rc" != 0 ]; then
              rest=$(echo "$out" | grep -viE 'admin folder could not be renamed|^Errors [0-9]+:$')
              if ! echo "$out" | grep -qi 'admin folder could not be renamed' || echo "$rest" | grep -qiE 'error|exception|fatal'; then exit "$rc"; fi
              echo "(only the admin/ rename failed: going on)"
            fi
            docker exec ps rm -rf /var/www/html/install
          fi
          for i in $(seq 1 90); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = 200 ] && break; sleep 5; done
          echo "shop: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)"
          zip=$(bin/build-prestashop.sh /tmp/dist)
          mkdir -p /tmp/psmod && unzip -q "$zip" -d /tmp/psmod
          docker cp /tmp/psmod/dracoinsomnis ps:/var/www/html/modules/
          docker exec ps chown -R www-data:www-data /var/www/html/modules/dracoinsomnis
          docker exec -u www-data ps php bin/console prestashop:module install dracoinsomnis
          $MYSQL -e "UPDATE ps_configuration SET value='0' WHERE name IN ('PS_REWRITING_SETTINGS','PS_CANONICAL_REDIRECT','PS_SHOP_ENABLE_MAINTENANCE'); UPDATE ps_configuration SET value='1' WHERE name='PS_SHOP_ENABLE'"
          docker exec ps rm -rf /var/www/html/var/cache/prod /var/www/html/var/cache/dev
      - name: End-to-end tests
        run: tests/e2e/prestashop.sh
      - name: PHP errors from the run
        if: always()
        run: docker logs ps 2>&1 | tail -40 || true

  moodle:
    name: Moodle ${{ matrix.branch }} — end to end
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ['MOODLE_405_STABLE', 'MOODLE_503_STABLE']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: moodle
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MD_DIR: /tmp/moodle
      BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, intl, sodium, zip, gd, soap, exif, curl, xml, mbstring
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install Moodle (${{ matrix.branch }}) and the plugin ZIP
        run: |
          git clone -q --depth 1 -b ${{ matrix.branch }} https://github.com/moodle/moodle.git "$MD_DIR"
          mkdir -p /tmp/moodledata && chmod 777 /tmp/moodledata
          web="$MD_DIR"; [ -d "$MD_DIR/public" ] && web="$MD_DIR/public"
          echo "MD_WEB=$web" >> "$GITHUB_ENV"
          zip=$(bin/build-moodle.sh /tmp/dist)
          unzip -q "$zip" -d "$web/local"
          cd "$MD_DIR"
          php admin/cli/install.php --wwwroot="$BASE" --dataroot=/tmp/moodledata --dbtype=mysqli --dbhost=127.0.0.1 \
            --dbname=moodle --dbuser=root --dbpass=root --prefix=mdl_ --fullname=Draco --shortname=Draco \
            --adminuser=admin --adminpass='Draco-CI-2026-admin' --adminemail=admin@example.org --agree-license --non-interactive
          php admin/cli/cfg.php --name=auth --set=email
          php admin/cli/cfg.php --name=noemailever --set=1
          php -r 'define("CLI_SCRIPT", true); require "config.php"; echo "local_dracoinsomnis: ", get_config("local_dracoinsomnis", "version"), "\n";'
      - name: End-to-end tests
        run: |
          (cd "$MD_WEB" && PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8080 > /tmp/php-server.log 2>&1 &)
          sleep 2
          cd "$MD_DIR"
          "$GITHUB_WORKSPACE/tests/e2e/moodle.sh"
      - name: PHP errors from the run
        if: always()
        run: grep -iE 'fatal|draco|exception' /tmp/php-server.log | head -20 || true

  laravel:
    name: Laravel ${{ matrix.laravel }} package (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11'
            testbench: '^9.0'
            php: '8.3'
          - laravel: '13'
            testbench: '^11.0'
            php: '8.4'
    defaults:
      run:
        working-directory: cms/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Install
        run: |
          # Every Laravel 11 release has open advisories, so Composer refuses it by default. This is a
          # throwaway test install only: the package itself supports 11 because our own apps run it.
          composer config policy.advisories.block false
          composer require --dev --no-interaction --no-progress -W "orchestra/testbench:${{ matrix.testbench }}"
          composer show laravel/framework | grep -E '^versions'
      - run: vendor/bin/phpunit

  server:
    name: Server edition — ${{ matrix.os }} with ${{ matrix.web }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            web: nginx and PHP-FPM
          - os: ubuntu-22.04
            web: Apache and mod_php
    steps:
      - uses: actions/checkout@v4
      - name: Web server and PHP from the distribution
        run: |
          sudo apt-get update -qq
          if [[ "${{ matrix.web }}" == nginx* ]]; then
            sudo apt-get install -y -qq nginx php-fpm php-cli php-sqlite3 >/dev/null
            sock=$(ls /run/php/php*-fpm.sock | head -1)
            printf 'server {\n listen 80 default_server;\n root /var/www/html;\n index index.php;\n location ~ \\.php$ {\n  include snippets/fastcgi-php.conf;\n  fastcgi_pass unix:%s;\n }\n}\n' "$sock" | sudo tee /etc/nginx/sites-available/default >/dev/null
            sudo systemctl restart nginx
          else
            sudo apt-get install -y -qq apache2 libapache2-mod-php php-cli php-sqlite3 >/dev/null
            sudo systemctl restart apache2
          fi
          echo '<?php echo "app ok";' | sudo tee /var/www/html/index.php >/dev/null
          echo '<?php echo $_SERVER["REMOTE_ADDR"];' | sudo tee /var/www/html/ip.php >/dev/null
          echo '<?php header("X-Frame-Options: DENY"); echo "own";' | sudo tee /var/www/html/own-header.php >/dev/null
          sudo rm -f /var/www/html/index.html
          php -v | head -1
      - name: Build and install the .deb
        run: |
          deb=$(bin/build-server.sh dist | grep '\.deb$')
          dpkg-deb --info "$deb" | sed -n '/Package/,/Depends/p'
          dpkg-deb --contents "$deb" | grep -E 'tests/|vendor/|\.github' && { echo "Development files in the package"; exit 1; } || true
          sudo apt-get install -y "./$deb"
          sudo draco enable
          sleep 2
      - name: End-to-end tests
        run: BASE=http://127.0.0.1 DRACO="sudo draco" bash tests/e2e/server.sh
      - name: Remove and purge
        run: |
          sudo apt-get remove -y draco-insomnis-server >/dev/null
          ls /etc/php/*/*/conf.d/99-draco-insomnis.ini 2>/dev/null && { echo "Still loaded after removal"; exit 1; } || echo "not loaded after removal"
          [ "$(curl -s http://127.0.0.1/index.php)" = "app ok" ] && echo "site still answers"
          sudo apt-get purge -y draco-insomnis-server >/dev/null
          [ ! -d /var/lib/draco-insomnis ] && echo "evidence removed on purge"
      - name: PHP errors from the run
        if: always()
        run: sudo grep -rh "Draco Insomnis Server" /var/log/nginx /var/log/apache2 /var/log/php* 2>/dev/null | tail -20 || true

  server-rpm:
    name: Server edition — AlmaLinux 9 (.rpm, PHP-FPM ${{ matrix.php }} and httpd)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    container: almalinux:9
    steps:
      - uses: actions/checkout@v4
      - name: httpd and PHP ${{ matrix.php }} from AppStream
        run: |
          dnf -y -q module reset php
          dnf -y -q module enable php:${{ matrix.php }} || [ "${{ matrix.php }}" = "8.0" ]
          dnf -y -q install httpd php-fpm php-cli php-pdo rpm-build procps-ng >/dev/null
          php -v | head -1
          mkdir -p /run/php-fpm && php-fpm -D
          httpd -k start
          echo '<?php echo "app ok";' > /var/www/html/index.php
          echo '<?php echo $_SERVER["REMOTE_ADDR"];' > /var/www/html/ip.php
          echo '<?php header("X-Frame-Options: DENY"); echo "own";' > /var/www/html/own-header.php
          sleep 1; curl -s http://127.0.0.1/index.php
      - name: Build and install the .rpm
        run: |
          rpm=$(bin/build-server.sh dist | grep '\.rpm$')
          rpm -qip "$rpm" | sed -n '1,4p'
          rpm -qlp "$rpm" | grep -E 'tests/|vendor/|\.github' && { echo "Development files in the package"; exit 1; } || true
          dnf -y -q install "./$rpm"
          draco enable
          pkill -USR2 php-fpm; sleep 1
      - name: End-to-end tests
        run: BASE=http://127.0.0.1 DRACO=draco SUDO= RELOAD='pkill -USR2 php-fpm' bash tests/e2e/server.sh
      - name: Remove
        run: |
          dnf -y -q remove draco-insomnis-server
          ls /etc/php.d/99-draco-insomnis.ini 2>/dev/null && { echo "Still loaded after removal"; exit 1; } || echo "not loaded after removal"
          pkill -USR2 php-fpm; sleep 1
          [ "$(curl -s http://127.0.0.1/index.php)" = "app ok" ] && echo "site still answers"
      - name: PHP errors from the run
        if: always()
        run: grep -h "Draco Insomnis Server" /var/log/php-fpm/*.log /var/log/httpd/*log 2>/dev/null | tail -20 || true

  docker:
    name: Docker add-on — ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ['inside the image (php:8.3-apache)', 'volume, no rebuild (php:8.2-apache)']
    steps:
      - uses: actions/checkout@v4
      - name: Build the add-on image
        run: bin/build-docker.sh draco-insomnis:test
      - name: The app container
        run: |
          w=$(mktemp -d); chmod 755 "$w"
          printf '<?php echo "app ok";\n' > "$w/index.php"
          printf '<?php echo $_SERVER["REMOTE_ADDR"];\n' > "$w/ip.php"
          printf '<?php header("X-Frame-Options: DENY"); echo "own";\n' > "$w/own-header.php"
          if [[ "${{ matrix.mode }}" == inside* ]]; then
            printf 'FROM php:8.3-apache\nCOPY --from=draco-insomnis:test /draco /opt/draco\nRUN sh /opt/draco/install-docker.sh\nCOPY index.php ip.php own-header.php /var/www/html/\n' > "$w/Dockerfile"
            docker build -q -t app "$w"
            docker run -d --name app -p 8080:80 app
          else
            docker run --rm -v draco:/opt/draco draco-insomnis:test
            docker run -d --name app -p 8080:80 -e PHP_INI_SCAN_DIR=:/opt/draco/conf.d -v draco:/opt/draco -v "$w":/var/www/html:ro php:8.2-apache
          fi
          sleep 3; curl -s http://127.0.0.1:8080/index.php
      - name: End-to-end tests
        run: |
          common=(BASE=http://127.0.0.1:8080 TEST_URL=http://127.0.0.1/index.php SUDO="docker exec app" RELOAD="docker exec app apachectl -k graceful")
          if [[ "${{ matrix.mode }}" == inside* ]]; then
            env "${common[@]}" DRACO="docker exec app draco" bash tests/e2e/server.sh
          else
            env "${common[@]}" DRACO="docker exec app php /opt/draco/share/bin/draco" STATE=/opt/draco/state INI=/opt/draco/draco.ini bash tests/e2e/server.sh
          fi
      - name: Upgrading the add-on keeps settings and evidence
        if: ${{ startsWith(matrix.mode, 'volume') }}
        run: |
          docker exec app php /opt/draco/share/bin/draco set waf_mode block
          docker run --rm -v draco:/opt/draco draco-insomnis:test
          [ "$(docker exec app php /opt/draco/share/bin/draco get waf_mode)" = block ] && echo "settings kept"
      - name: Draco errors from the run
        if: always()
        run: docker logs app 2>&1 | grep -i "draco insomnis" | tail -20 || true

  apps:
    name: Draco in front of ${{ matrix.app }} (Docker add-on)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ['MediaWiki 1.43', 'TYPO3 13']
    steps:
      - uses: actions/checkout@v4
      - name: Build the add-on image and fill the volume
        run: |
          bin/build-docker.sh draco-insomnis:test
          docker run --rm -v draco:/opt/draco draco-insomnis:test
      - name: Install ${{ matrix.app }} with Draco loaded
        run: |
          if [[ "${{ matrix.app }}" == MediaWiki* ]]; then
            docker run -d --name app -p 8080:80 -e PHP_INI_SCAN_DIR=:/opt/draco/conf.d -v draco:/opt/draco mediawiki:1.43
            sleep 3
            docker exec app bash -c 'mkdir -p /var/www/data && chown www-data /var/www/data && php maintenance/run.php install --dbtype=sqlite --dbpath=/var/www/data --server=http://127.0.0.1:8080 --scriptpath="" --pass="Draco-Lab-2026-wiki!" "Draco Wiki" admin | tail -1 && chown -R www-data /var/www/data'
          else
            docker build -q -t typo3-lab tests/e2e/typo3
            docker run -d --name app -p 8080:80 -e PHP_INI_SCAN_DIR=:/opt/draco/conf.d -v draco:/opt/draco typo3-lab
            sleep 3
            docker exec -u www-data -w /var/www/typo3 app vendor/bin/typo3 setup --driver=sqlite --admin-username=admin --admin-user-password='Draco-Lab-2026!x'               --admin-email=admin@example.org --project-name="Draco TYPO3" --server-type=apache --create-site="http://127.0.0.1:8080/" --force -n | tail -1
          fi
      - name: End-to-end tests
        run: |
          common=(BASE=http://127.0.0.1:8080 DRACO="docker exec app php /opt/draco/share/bin/draco" SUDO="docker exec app" STATE=/opt/draco/state RELOAD="docker exec app apachectl -k graceful")
          if [[ "${{ matrix.app }}" == MediaWiki* ]]; then
            env "${common[@]}" APP=MediaWiki HOME_PATH=/index.php MARK="Draco Wiki" LOGIN_PATH=/index.php/Special:UserLogin TEST_URL=http://127.0.0.1/index.php bash tests/e2e/apps.sh
          else
            env "${common[@]}" APP=TYPO3 HOME_PATH=/ MARK="powered by TYPO3" LOGIN_PATH=/typo3/ TEST_URL=http://127.0.0.1/ bash tests/e2e/apps.sh
          fi
      - name: Draco errors from the run
        if: always()
        run: docker logs app 2>&1 | grep -i "draco insomnis" | tail -20 || true

  crowdsec:
    name: Draco and CrowdSec, both ways
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bans in, attacks out (real CrowdSec Local API and agent)
        run: bash tests/e2e/crowdsec.sh

  package:
    name: ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          zip=$(bin/build-zip.sh dist)
          version=$(sed -n 's/^ \* Version: *//p' draco-insomnis.php | tr -d '[:space:]')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1
          fi
          if unzip -l "$zip" | grep -E 'tests/|vendor/|\.github|composer\.json|phpunit'; then echo "Development files in the ZIP"; exit 1; fi
          sha256sum "$zip"
      - name: Build the PrestaShop module
        run: |
          zip=$(bin/build-prestashop.sh dist)
          check=$(mktemp -d)
          unzip -q "$zip" -d "$check"
          for f in $(find "$check" -name '*.php'); do
            php -l "$f" > /dev/null
            grep -q "_PS_VERSION_\|^header('Location: ../');" "$f" || { echo "No _PS_VERSION_ guard in ${f#$check/}"; exit 1; }
          done
          for d in $(find "$check/dracoinsomnis" -type d); do [ -f "$d/index.php" ] || { echo "No index.php in ${d#$check/}"; exit 1; }; done
          sha256sum "$zip"
      - name: Build the Drupal module
        run: |
          zip=$(bin/build-drupal.sh dist)
          check=$(mktemp -d)
          unzip -q "$zip" -d "$check"
          for f in $(find "$check" -name '*.php' -o -name '*.module' -o -name '*.install'); do php -l "$f" > /dev/null; done
          for f in $(find "$check" -name '*.yml'); do python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || { echo "Bad YAML: ${f#$check/}"; exit 1; }; done
          [ -f "$check/draco_insomnis/lib/Core/Shield.php" ] || { echo "Engines missing from lib/Core"; exit 1; }
          sha256sum "$zip"
      - name: Build the Joomla plugin
        run: |
          zip=$(bin/build-joomla.sh dist)
          check=$(mktemp -d)
          unzip -q "$zip" -d "$check"
          [ -f "$check/dracoinsomnis.xml" ] || { echo "Manifest not at the ZIP root"; exit 1; }
          python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "$check/dracoinsomnis.xml"
          for f in $(find "$check" -name '*.php'); do
            php -l "$f" > /dev/null
            grep -q "_JEXEC" "$f" || { echo "No _JEXEC guard in ${f#$check/}"; exit 1; }
          done
          for f in $(find "$check/language" -name '*.ini'); do php -r 'parse_ini_file($argv[1]) !== false || exit(1);' "$f" || { echo "Bad INI: ${f#$check/}"; exit 1; }; done
          sha256sum "$zip"
      - name: Build the Laravel package
        run: |
          zip=$(bin/build-laravel.sh dist)
          check=$(mktemp -d)
          unzip -q "$zip" -d "$check"
          [ -f "$check/draco-insomnis-laravel/core/Shield.php" ] && [ ! -L "$check/draco-insomnis-laravel/core" ] || { echo "core/ missing or still a link"; exit 1; }
          php -r '$j = json_decode(file_get_contents($argv[1]), true); exit(isset($j["version"], $j["extra"]["laravel"]["providers"]) ? 0 : 1);' "$check/draco-insomnis-laravel/composer.json" || { echo "composer.json without version or provider"; exit 1; }
          for f in $(find "$check" -name '*.php'); do php -l "$f" > /dev/null; done
          sha256sum "$zip"
      - name: Build the Moodle plugin
        run: |
          zip=$(bin/build-moodle.sh dist)
          check=$(mktemp -d)
          unzip -q "$zip" -d "$check"
          [ -f "$check/dracoinsomnis/version.php" ] || { echo "version.php not in dracoinsomnis/"; exit 1; }
          python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "$check/dracoinsomnis/db/install.xml"
          for f in $(find "$check" -name '*.php'); do
            php -l "$f" > /dev/null
            case "$f" in */evidence.php) ;; *) grep -q "MOODLE_INTERNAL" "$f" || { echo "No MOODLE_INTERNAL guard in ${f#$check/}"; exit 1; } ;; esac
          done
          sha256sum "$zip"
      - uses: actions/upload-artifact@v4
        with:
          name: draco-insomnis-zip
          path: dist/*.zip

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  wordpress:
    name: WordPress ${{ matrix.wp }} — integration, HTTP and Plugin Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: ['latest', '6.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1:3306
      DB_NAME: wordpress_test
      DB_USER: root
      DB_PASS: root
      WP_DIR: /tmp/wordpress
      WP_URL: http://127.0.0.1:8080
      WP_VERSION: ${{ matrix.wp }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, gd
          tools: wp-cli
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Install WordPress with the plugin ZIP
        run: bin/ci-wp-setup.sh
      - name: Integration tests
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist
      - name: HTTP tests
        run: |
          php -S 127.0.0.1:8080 -t "$WP_DIR" tests/ci/router.php > /tmp/php-server.log 2>&1 &
          sleep 2
          bin/ci-http-smoke.sh
      - name: WordPress.org Plugin Check
        if: matrix.wp == 'latest'
        run: |
          wp --path="$WP_DIR" plugin install plugin-check --activate
          wp --path="$WP_DIR" plugin check draco-insomnis --format=csv --fields=line,column,type,code,message,file | tee /tmp/plugin-check.csv
          if grep -qE ',(ERROR|WARNING),' /tmp/plugin-check.csv; then echo "Plugin Check found problems"; exit 1; fi
      - name: PHP notices from the run
        if: always()
        run: |
          if [ -s "$WP_DIR/wp-content/debug.log" ]; then
            cat "$WP_DIR/wp-content/debug.log"
            if grep -i 'draco' "$WP_DIR/wp-content/debug.log"; then echo "Draco caused PHP notices"; exit 1; fi
          fi

  laravel:
    name: Laravel ${{ matrix.laravel }} package (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11'
            testbench: '^9.0'
            php: '8.3'
          - laravel: '13'
            testbench: '^11.0'
            php: '8.4'
    defaults:
      run:
        working-directory: cms/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Install
        run: |
          # Every Laravel 11 release has open advisories, so Composer refuses it by default. This is a
          # throwaway test install only: the package itself supports 11 because our own apps run it.
          composer config policy.advisories.block false
          composer require --dev --no-interaction --no-progress -W "orchestra/testbench:${{ matrix.testbench }}"
          composer show laravel/framework | grep -E '^versions'
      - run: vendor/bin/phpunit

  package:
    name: ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          zip=$(bin/build-zip.sh dist)
          version=$(sed -n 's/^ \* Version: *//p' draco-insomnis.php | tr -d '[:space:]')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1
          fi
          if unzip -l "$zip" | grep -E 'tests/|vendor/|\.github|composer\.json|phpunit'; then echo "Development files in the ZIP"; exit 1; fi
          sha256sum "$zip"
      - name: Build the PrestaShop module
        run: |
          zip=$(bin/build-prestashop.sh dist)
          check=$(mktemp -d)
          unzip -q "$zip" -d "$check"
          for f in $(find "$check" -name '*.php'); do
            php -l "$f" > /dev/null
            grep -q "_PS_VERSION_\|^header('Location: ../');" "$f" || { echo "No _PS_VERSION_ guard in ${f#$check/}"; exit 1; }
          done
          for d in $(find "$check/dracoinsomnis" -type d); do [ -f "$d/index.php" ] || { echo "No index.php in ${d#$check/}"; exit 1; }; done
          sha256sum "$zip"
      - name: Build the Drupal module
        run: |
          zip=$(bin/build-drupal.sh dist)
          check=$(mktemp -d)
          unzip -q "$zip" -d "$check"
          for f in $(find "$check" -name '*.php' -o -name '*.module' -o -name '*.install'); do php -l "$f" > /dev/null; done
          for f in $(find "$check" -name '*.yml'); do python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || { echo "Bad YAML: ${f#$check/}"; exit 1; }; done
          [ -f "$check/draco_insomnis/lib/Core/Shield.php" ] || { echo "Engines missing from lib/Core"; exit 1; }
          sha256sum "$zip"
      - name: Build the Joomla plugin
        run: |
          zip=$(bin/build-joomla.sh dist)
          check=$(mktemp -d)
          unzip -q "$zip" -d "$check"
          [ -f "$check/dracoinsomnis.xml" ] || { echo "Manifest not at the ZIP root"; exit 1; }
          python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "$check/dracoinsomnis.xml"
          for f in $(find "$check" -name '*.php'); do
            php -l "$f" > /dev/null
            grep -q "_JEXEC" "$f" || { echo "No _JEXEC guard in ${f#$check/}"; exit 1; }
          done
          for f in $(find "$check/language" -name '*.ini'); do php -r 'parse_ini_file($argv[1]) !== false || exit(1);' "$f" || { echo "Bad INI: ${f#$check/}"; exit 1; }; done
          sha256sum "$zip"
      - name: Build the Laravel package
        run: |
          zip=$(bin/build-laravel.sh dist)
          check=$(mktemp -d)
          unzip -q "$zip" -d "$check"
          [ -f "$check/draco-insomnis-laravel/core/Shield.php" ] && [ ! -L "$check/draco-insomnis-laravel/core" ] || { echo "core/ missing or still a link"; exit 1; }
          php -r '$j = json_decode(file_get_contents($argv[1]), true); exit(isset($j["version"], $j["extra"]["laravel"]["providers"]) ? 0 : 1);' "$check/draco-insomnis-laravel/composer.json" || { echo "composer.json without version or provider"; exit 1; }
          for f in $(find "$check" -name '*.php'); do php -l "$f" > /dev/null; done
          sha256sum "$zip"
      - name: Build the Moodle plugin
        run: |
          zip=$(bin/build-moodle.sh dist)
          check=$(mktemp -d)
          unzip -q "$zip" -d "$check"
          [ -f "$check/dracoinsomnis/version.php" ] || { echo "version.php not in dracoinsomnis/"; exit 1; }
          python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "$check/dracoinsomnis/db/install.xml"
          for f in $(find "$check" -name '*.php'); do
            php -l "$f" > /dev/null
            case "$f" in */evidence.php) ;; *) grep -q "MOODLE_INTERNAL" "$f" || { echo "No MOODLE_INTERNAL guard in ${f#$check/}"; exit 1; } ;; esac
          done
          sha256sum "$zip"
      - uses: actions/upload-artifact@v4
        with:
          name: draco-insomnis-zip
          path: dist/*.zip

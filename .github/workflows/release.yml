name: Release

# Pushing a tag vX.Y.Z publishes one GitHub release with one package per CMS, all built from the same
# commit. Before tagging: bin/set-version.sh X.Y.Z, a changelog entry in readme.txt, and a green CI.

on:
  push:
    tags: ['v*.*.*']
  # Stages the JavaScript package of a release that already exists (e.g. if npm was down).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.27'
        required: true

permissions:
  contents: write
  packages: write
  # Keyless signing (Sigstore) and GitHub's build provenance: no key is stored anywhere.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish one package per platform
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag and versions agree
        run: bin/versions.sh --check "${GITHUB_REF_NAME#v}"
      - name: Unit tests of the shared engines
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit
      - name: Build
        run: |
          rm -rf release && mkdir release
          sudo apt-get install -y -qq rpm >/dev/null
          pip install --quiet build
          bin/build-all.sh release | tee release/files.txt
          (cd release && sha256sum *.zip *.deb *.rpm *.tar.gz *.tgz *.whl *.html *.gem *.nupkg *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Build provenance (gh attestation verify <file> -R fermatacordis-create/draco-insomnis)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.zip
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.tgz
            release/*.whl
            release/*.html
            release/*.gem
            release/*.nupkg
            release/*.jar
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksums (cosign verify-blob, see SECURITY.md)
        run: |
          cosign sign-blob --yes --bundle release/SHA256SUMS.txt.sigstore.json release/SHA256SUMS.txt
          cosign verify-blob --bundle release/SHA256SUMS.txt.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com release/SHA256SUMS.txt
      - name: Docker image (ghcr.io/fermatacordis-create/draco-insomnis)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image=ghcr.io/fermatacordis-create/draco-insomnis
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          bin/build-docker.sh "$image:$version" "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
          docker inspect --format '{{index .RepoDigests 0}}' "$image:$version" | tee release/docker-digest.txt
          # The image is signed by digest, keyless, like the files.
          cosign sign --yes "$(cat release/docker-digest.txt)"
      # After the image: the SBOM lists it by digest. Written by bin/build-sbom.php from the files
      # really in release/ (Draco ships no third-party code, so a scanner finds almost nothing).
      - name: SBOM (CycloneDX 1.6) of every package, the image, the shared engines and the outside services
        run: |
          php bin/build-sbom.php release "release/draco-insomnis-${GITHUB_REF_NAME}.cdx.json"
          docker run --rm -v "$PWD/release:/w" cyclonedx/cyclonedx-cli:0.27.2 validate             --input-file "/w/draco-insomnis-${GITHUB_REF_NAME}.cdx.json" --input-version v1_6 --fail-on-errors
      - name: SBOM attestation
        uses: actions/attest-sbom@v2
        with:
          subject-path: release/SHA256SUMS.txt
          sbom-path: release/draco-insomnis-${{ github.ref_name }}.cdx.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="= $version =" '$0 == v {on = 1; next} on && /^= / {exit} on {print}' readme.txt)
          {
            echo "One package per CMS, all built from the same commit and the same engines (src/Core)."
            echo
            echo "| CMS | Package |"
            echo "| --- | --- |"
            echo "| WordPress 6.5+ | \`draco-insomnis-wordpress-$version.zip\` |"
            echo "| PrestaShop 8 and 9 | \`dracoinsomnis-prestashop-$version.zip\` |"
            echo "| Drupal 10.3 and 11 | \`draco_insomnis-drupal-$version.zip\` |"
            echo "| Joomla 5 and 6 | \`plg_system_dracoinsomnis-joomla-$version.zip\` |"
            echo "| Moodle 4.5 to 5.x | \`local_dracoinsomnis-moodle-$version.zip\` |"
            echo "| Laravel 11 to 13 (Composer package) | \`draco-insomnis-laravel-$version.zip\` |"
            echo "| Magento 2.4 and Mage-OS (Composer package or app/code) | \`draco-insomnis-magento-$version.zip\` |"
            echo "| Any PHP site on a Debian or Ubuntu server | \`draco-insomnis-server_${version}_all.deb\` |"
            echo "| Any PHP site on RHEL, AlmaLinux, Rocky or Fedora | \`draco-insomnis-server-$version-1.noarch.rpm\` |"
            echo "| Any PHP container (Docker add-on) | \`ghcr.io/fermatacordis-create/draco-insomnis:$version\` |"
            echo "| Any PHP site on another Linux (install.sh) | \`draco-insomnis-server-$version.tar.gz\` |"
            echo "| Python: FastAPI, Starlette, Flask, Django (ASGI and WSGI) | \`draco_insomnis-$version-py3-none-any.whl\`, \`draco_insomnis-$version.tar.gz\` (\`pip install ./draco_insomnis-$version-py3-none-any.whl\`) |"
            echo "| Static sites (plain HTML): .htaccess, nginx, Netlify, Vercel or a Cloudflare Worker | \`draco-insomnis-static-$version.html\` (open it in a browser; nothing is sent anywhere) |"
            echo "| Go: Caddy module, Traefik plugin, net/http middleware | \`xcaddy build --with github.com/fermatacordis-create/draco-insomnis/go/caddy@v$version\` (Go modules tagged \`go/draco/v$version\` and \`go/caddy/v$version\`) |"
            echo "| Ruby: Rails, Sinatra, Hanami, Roda (Rack) | \`draco-insomnis-$version.gem\` (\`gem install ./draco-insomnis-$version.gem\`) |"
            echo "| .NET: ASP.NET Core (minimal APIs, MVC, Razor Pages, Blazor Server) | \`DracoInsomnis.$version.nupkg\` (\`dotnet add package DracoInsomnis -v $version -s <folder>\`) |"
            echo "| Java: Spring Boot, Tomcat, Jetty, Undertow (Jakarta Servlet 6 filter) | \`draco-insomnis-$version.jar\` (\`mvn install:install-file -Dfile=draco-insomnis-$version.jar\`) |"
            echo "| Kotlin: Ktor 3 plugin | \`draco-insomnis-ktor-$version.jar\` (with \`draco-insomnis-$version.jar\`) |"
            echo "| Node.js: Express, Koa, Strapi, Directus; Cloudflare Workers | \`draco-insomnis-js-$version.tgz\` (also \`npm install draco-insomnis@$version\`, once approved on npm) |"
            echo
            echo "Checksums in \`SHA256SUMS.txt\`, signed with Sigstore (\`SHA256SUMS.txt.sigstore.json\`). Every file has a GitHub build provenance attestation and the release has a CycloneDX SBOM. How to verify: SECURITY.md."
            if [ -n "$notes" ]; then echo; echo "## Changes"; echo; echo "$notes"; fi
          } > release/notes.md
          # Go modules in sub-folders are versioned by tags that carry the folder: go/draco/vX, go/caddy/vX.
          git tag "go/draco/$GITHUB_REF_NAME" "$GITHUB_SHA" && git tag "go/caddy/$GITHUB_REF_NAME" "$GITHUB_SHA"
          git push origin "go/draco/$GITHUB_REF_NAME" "go/caddy/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.deb release/*.rpm release/*.tar.gz release/*.tgz release/*.whl release/*.html release/*.gem release/*.nupkg release/*.jar release/SHA256SUMS.txt release/SHA256SUMS.txt.sigstore.json release/*.cdx.json \
            --title "Draco Insomnis $version" --notes-file release/notes.md

  npm:
    name: Stage the JavaScript package on npm (a maintainer approves it there with 2FA)
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Trusted publishing (OIDC): no npm token is stored anywhere. The trust on npmjs.com allows
      # only "npm stage publish", so nothing reaches npm until a maintainer presses Approve.
      # It stages the very file of the GitHub release, after checking it against SHA256SUMS.txt.
      - name: Stage the file of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1;; esac
          version="${TAG#v}"
          mkdir npm && cd npm
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -p "draco-insomnis-js-$version.tgz"
          grep " draco-insomnis-js-$version.tgz\$" SHA256SUMS.txt | sha256sum -c -
          # "./": without it npm 12 reads "dir/file.tgz" as a GitHub repository.
          npx -y npm@12.2.2 stage publish "./draco-insomnis-js-$version.tgz" --provenance --access public

  pypi:
    name: Publish the Python package on PyPI (a maintainer approves it in GitHub)
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # The "pypi" environment waits for a maintainer's approval and only runs for v* tags. Trusted
    # publishing (OIDC): no PyPI token is stored anywhere; PyPI adds its own attestations.
    environment:
      name: pypi
      url: https://pypi.org/project/draco-insomnis/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: The Python files of the GitHub release, checked against SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1;; esac
          version="${TAG#v}"
          mkdir dist && cd dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -p "draco_insomnis-$version-py3-none-any.whl" -p "draco_insomnis-$version.tar.gz"
          grep -E " draco_insomnis-$version(-py3-none-any\.whl|\.tar\.gz)\$" SHA256SUMS.txt | sha256sum -c -
          rm SHA256SUMS.txt
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

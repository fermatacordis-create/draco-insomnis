name: Release

# Pushing a tag vX.Y.Z publishes one GitHub release with one package per CMS, all built from the same
# commit. Before tagging: bin/set-version.sh X.Y.Z, a changelog entry in readme.txt, and a green CI.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  # Keyless signing (Sigstore) and GitHub's build provenance: no key is stored anywhere.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish one package per platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tag and versions agree
        run: bin/versions.sh --check "${GITHUB_REF_NAME#v}"
      - name: Unit tests of the shared engines
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit
      - name: Build
        run: |
          rm -rf release && mkdir release
          sudo apt-get install -y -qq rpm >/dev/null
          bin/build-all.sh release | tee release/files.txt
          (cd release && sha256sum *.zip *.deb *.rpm *.tar.gz *.tgz > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: SBOM (CycloneDX) of every package
        uses: anchore/sbom-action@v0
        with:
          path: release
          format: cyclonedx-json
          output-file: release/draco-insomnis-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build provenance (gh attestation verify <file> -R fermatacordis-create/draco-insomnis)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.zip
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.tgz
      - name: SBOM attestation
        uses: actions/attest-sbom@v2
        with:
          subject-path: release/SHA256SUMS.txt
          sbom-path: release/draco-insomnis-${{ github.ref_name }}.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksums (cosign verify-blob, see SECURITY.md)
        run: |
          cosign sign-blob --yes --bundle release/SHA256SUMS.txt.sigstore.json release/SHA256SUMS.txt
          cosign verify-blob --bundle release/SHA256SUMS.txt.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com release/SHA256SUMS.txt
      - name: Docker image (ghcr.io/fermatacordis-create/draco-insomnis)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image=ghcr.io/fermatacordis-create/draco-insomnis
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          bin/build-docker.sh "$image:$version" "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
          docker inspect --format '{{index .RepoDigests 0}}' "$image:$version" | tee release/docker-digest.txt
          # The image is signed by digest, keyless, like the files.
          cosign sign --yes "$(cat release/docker-digest.txt)"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="= $version =" '$0 == v {on = 1; next} on && /^= / {exit} on {print}' readme.txt)
          {
            echo "One package per CMS, all built from the same commit and the same engines (src/Core)."
            echo
            echo "| CMS | Package |"
            echo "| --- | --- |"
            echo "| WordPress 6.5+ | \`draco-insomnis-wordpress-$version.zip\` |"
            echo "| PrestaShop 8 and 9 | \`dracoinsomnis-prestashop-$version.zip\` |"
            echo "| Drupal 10.3 and 11 | \`draco_insomnis-drupal-$version.zip\` |"
            echo "| Joomla 5 and 6 | \`plg_system_dracoinsomnis-joomla-$version.zip\` |"
            echo "| Moodle 4.5 to 5.x | \`local_dracoinsomnis-moodle-$version.zip\` |"
            echo "| Laravel 11 to 13 (Composer package) | \`draco-insomnis-laravel-$version.zip\` |"
            echo "| Any PHP site on a Debian or Ubuntu server | \`draco-insomnis-server_${version}_all.deb\` |"
            echo "| Any PHP site on RHEL, AlmaLinux, Rocky or Fedora | \`draco-insomnis-server-$version-1.noarch.rpm\` |"
            echo "| Any PHP container (Docker add-on) | \`ghcr.io/fermatacordis-create/draco-insomnis:$version\` |"
            echo "| Any PHP site on another Linux (install.sh) | \`draco-insomnis-server-$version.tar.gz\` |"
            echo "| Node.js: Express, Koa, Strapi, Directus; Cloudflare Workers | \`draco-insomnis-js-$version.tgz\` (\`npm install ./draco-insomnis-js-$version.tgz\`) |"
            echo
            echo "Checksums in \`SHA256SUMS.txt\`, signed with Sigstore (\`SHA256SUMS.txt.sigstore.json\`). Every file has a GitHub build provenance attestation and the release has a CycloneDX SBOM. How to verify: SECURITY.md."
            if [ -n "$notes" ]; then echo; echo "## Changes"; echo; echo "$notes"; fi
          } > release/notes.md
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.deb release/*.rpm release/*.tar.gz release/*.tgz release/SHA256SUMS.txt release/SHA256SUMS.txt.sigstore.json release/*.cdx.json \
            --title "Draco Insomnis $version" --notes-file release/notes.md
